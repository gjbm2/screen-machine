# One X screen per TV (installed to /etc/X11/xorg.conf.d/20-zaphod.conf).
# Why: with a single 7680x2160 X screen, Xorg's Present extension can never page-flip either kiosk window
# (a flip needs the window to cover the whole screen), so every frame is copied into a shared front buffer:
# tearing and ~30 fps per TV on the N95 (measured 2026-10-13, docs/KIOSK_INFRASTRUCTURE_NOTES.md).
# With ZaphodHeads each output is its own screen (:0.0 = HDMI-1 north, :0.1 = HDMI-2 south); a full-screen
# Chrome window then covers its screen and can flip on its own TV's vblank. kiosk-loop.sh detects 2 screens.
# Undo: delete this file and restart kiosk.service.
Section "Device"
    Identifier "gpu-north"
    Driver     "modesetting"
    BusID      "PCI:0:2:0"
    Option     "ZaphodHeads" "HDMI-1"
    Screen     0
EndSection

Section "Device"
    Identifier "gpu-south"
    Driver     "modesetting"
    BusID      "PCI:0:2:0"
    Option     "ZaphodHeads" "HDMI-2"
    Screen     1
EndSection

Section "Screen"
    Identifier "screen-north"
    Device     "gpu-north"
    Monitor    "HDMI-1"
EndSection

Section "Screen"
    Identifier "screen-south"
    Device     "gpu-south"
    Monitor    "HDMI-2"
EndSection

Section "ServerLayout"
    Identifier "per-tv-screens"
    Screen     0 "screen-north"
    Screen     1 "screen-south" RightOf "screen-north"
EndSection
