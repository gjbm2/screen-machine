# sway as the kiosk display server (default since 2026-10-13; installed to /usr/local/share/kiosk/sway-kiosk.conf,
# started by kiosk.service).
# One workspace per TV, each pinned to its output; kiosk-wayland.sh puts one full-screen Chrome on each.
# Why Wayland: Chrome's VA-API zero-copy video path crashes on X11 (docs/KIOSK_INFRASTRUCTURE_NOTES.md §3), and
# without it two 4K60 streams saturate the GPU's video-processing engine. Each output flips on its own vblank.
output HDMI-A-1 mode 3840x2160@60Hz position 0 0
output HDMI-A-2 mode 3840x2160@60Hz position 3840 0
output * bg #000000 solid_color
output * adaptive_sync off
workspace 1 output HDMI-A-1
workspace 2 output HDMI-A-2
default_border none
default_floating_border none
focus_follows_mouse no
focus_on_window_activation none
seat * hide_cursor 100
# nothing runs swayidle, so outputs never blank
exec /usr/local/bin/kiosk-wayland.sh
