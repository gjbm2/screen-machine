# Drop-in for netplan's generated 10-netplan-wlp2s0.network (installed to
# /etc/systemd/network/10-netplan-wlp2s0.network.d/). Traffic FROM the Wi-Fi address always leaves via Wi-Fi,
# so the box stays reachable on 192.168.1.92 even if the Ethernet/powerline path fails while its link is up.
# If the Wi-Fi DHCP address ever changes, update From= (the rule then simply stops matching).
[RoutingPolicyRule]
From=192.168.1.92/32
Table=102
Priority=102

[Route]
Gateway=192.168.1.1
GatewayOnLink=yes
Table=102

[Route]
Destination=192.168.1.0/24
Scope=link
Table=102
