# The eval songs' sections, annotated by reading each song's timed lyrics against its known form (27 Nov 2026;
# two annotators over the 21 songs, checked against the AI briefs made separately from the same lyrics: starts agree
# within a few seconds). reference.py takes these in place of its audio-novelty boundaries, which cut most songs in
# the wrong places (Dancing Queen mid-chorus). start_s is the lyrics' own time (before a song's offsets); kind is
# intro | verse | prechorus | chorus | bridge | instrumental | outro; size is how big the section should feel within
# the song (0..1); arrive is how the music gets there (none | swell | bump | snap); final marks the last full chorus
# and peak the song's one high point. Where a lyric file's line was more than 2 s off the recording, the annotators
# used the audible onset (Freed from Desire, Hallelujah's choruses, Shallow's bridge, Uptown Funk, Bohemian Rhapsody).
# Correct a line here when a song is found to be wrong, on purpose: its reference is made again on the next run, and
# runs before and after are no longer comparable for that song.
# liveliness: what kind of song each is, on one scale, judged by ear and not by any measure: 0 hushed (a voice and
# little else), 1 a ballad that builds, 2 a mid-tempo or dark song with drive, 3 a dance-floor or stadium song, 4 club.
# form.character asks whether songs far apart on it got shows that look far apart.
