<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>screen/machine</title>
    <meta name="description" content="Screen Machine: a room's screens, lights and music" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="color-scheme" content="light dark" />
    <!-- added to the Home Screen it runs as an app of its own: Safari's bars gone, the status bar its own strip above
         the page ("default": the page starts below it, so the app's top bar never sits under it) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Screen Machine" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf8f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#110f0e" />
    <script>
      // the TVs' /display pages never go dark (src/darkMode.ts keeps this right as the route changes); they are black
      // from their first frame (sm-display below), never the app's light page
      if (/^\/display(\/|$)/.test(location.pathname)) document.documentElement.classList.add("light-only", "sm-display");
    </script>
    <style>
      html.sm-display,
      html.sm-display body {
        background: #000 !important;
      }
      /* a TV page starts under black and fades in when its first picture is on glass (see the script in <body>) */
      #sm-cover {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        background: #000;
        pointer-events: none;
        transition: opacity 1s ease;
      }
    </style>
    <style>
      /* Style overrides for bucket view */
      .bucket-grid-container img {
        object-fit: cover;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <!-- the colour iPadOS gives its status bar in the Home Screen app, instead of blurring the top of the page: see
         .ios-status-bar-band in src/index.css. Here, not in React, so it is there from the first frame. -->
    <div class="ios-status-bar-band" aria-hidden="true"></div>
    <script>
      // iPadOS takes the status bar's colour from the band when it lays the page out; a change of the device's dark
      // setting only changes the band's colour (CSS), which it may not look at again. So on that change (and on
      // coming back to the app) the band's height moves by a pixel (12 <-> 13, both over WebKit's 10px rule): a new
      // layout of the fixed edge, so the colour is read again. The band itself never goes away (a frame without it
      // can bring the blur back).
      (function () {
        var band = document.querySelector(".ios-status-bar-band");
        var mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
        if (!band || !mq) return;
        var nudge = function () { band.style.height = band.style.height === "13px" ? "12px" : "13px"; };
        if (mq.addEventListener) mq.addEventListener("change", nudge); else if (mq.addListener) mq.addListener(nudge);
        document.addEventListener("visibilitychange", function () { if (!document.hidden) nudge(); });
      })();
    </script>
    <script>
      // A TV page (re)loads under black and fades in from it (owner, 23 Nov: a reload or a browser restart went
      // through plain white). The display page calls __smReveal() when its first picture (or live) is on glass; it
      // never stays black past 12 s. data-sm-painted marks the first frame drawn: the kiosk's launcher keeps a new
      // Chrome window out of sight until then (media-server/remote-scripts/wayland/kiosk-wayland.sh).
      (function () {
        var root = document.documentElement;
        if (!root.classList.contains("sm-display")) return;
        var cover = document.createElement("div");
        cover.id = "sm-cover";
        document.body.appendChild(cover);
        window.__smReveal = function () {
          if (!cover.parentNode || cover.style.opacity === "0") return;
          cover.style.opacity = "0";
          setTimeout(function () { if (cover.parentNode) cover.parentNode.removeChild(cover); }, 1100);
        };
        setTimeout(window.__smReveal, 12000);
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { root.setAttribute("data-sm-painted", "1"); });
        });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
