<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>screen/machine</title>
    <meta name="description" content="Screen Machine: the drawing room's screens, lights and music" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="color-scheme" content="light dark" />
    <!-- added to the Home Screen it runs as an app of its own: Safari's bars gone, the status bar its own strip above
         the page ("default": the page starts below it, so the app's top bar never sits under it) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Screen Machine" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf8f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#110f0e" />
    <script>
      // the TVs' /display pages never go dark (src/darkMode.ts keeps this right as the route changes)
      if (/^\/display(\/|$)/.test(location.pathname)) document.documentElement.classList.add("light-only");
    </script>
    <style>
      /* Style overrides for bucket view */
      .bucket-grid-container img {
        object-fit: cover;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <!-- the colour iPadOS gives its status bar in the Home Screen app, instead of blurring the top of the page: see
         .ios-status-bar-band in src/index.css. Here, not in React, so it is there from the first frame. -->
    <div class="ios-status-bar-band" aria-hidden="true"></div>
    <script>
      // iPadOS takes the status bar's colour from the band when it lays the page out; a change of the device's dark
      // setting only changes the band's colour (CSS), which it may not look at again. So on that change (and on
      // coming back to the app) the band's height moves by a pixel (12 <-> 13, both over WebKit's 10px rule): a new
      // layout of the fixed edge, so the colour is read again. The band itself never goes away (a frame without it
      // can bring the blur back).
      (function () {
        var band = document.querySelector(".ios-status-bar-band");
        var mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
        if (!band || !mq) return;
        var nudge = function () { band.style.height = band.style.height === "13px" ? "12px" : "13px"; };
        if (mq.addEventListener) mq.addEventListener("change", nudge); else if (mq.addListener) mq.addListener(nudge);
        document.addEventListener("visibilitychange", function () { if (!document.hidden) nudge(); });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
