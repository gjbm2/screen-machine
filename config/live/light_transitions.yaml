# Light transitions (docs/LIGHTS.md §6.4; show_service/light_scenes.py). kind: cut | dark_move | crossfade | fade_dark |
# sweep. The director chooses one with the screens' own decision (the look's transition style, or the song change's),
# so lights and screens cross over together at the same moment: a look's cut picks among cut and dark_move, a
# crossfade among crossfade and sweep, a song change through dark is fade_dark. A crossfade or sweep takes the look's
# own beats and seconds when it has them; the numbers here are used otherwise.
#   beats, seconds   a crossfade's length (beats with a clock grid, else seconds)
#   out_s, in_s      fade_dark: down to the group's dark_level over out_s, back up over in_s
#   wave_beats       sweep: each light starts at its place along the flow x this many beats (the screens get it too)
#   dark_move        movers travel dark when they would jump far (show.yaml lights.motion.dark_move_min_deg)
#   tags             transition_style (vocab: gentle | lively | wild), energy band, flow
# Hot-reloaded. Every number is a STARTING POINT: tune by watching the room.
version: 1
transitions:
  cut:        {label: Cut, kind: cut, tags: {transition_style: [wild], energy: [0.5, 1.0]}}
  dark-cut:   {label: "Cut, moving in the dark", kind: dark_move, tags: {transition_style: [lively, wild],
               energy: [0.3, 1.0]}}
  glide:      {label: Glide, kind: crossfade, beats: 4, seconds: 3, dark_move: true,
               tags: {transition_style: [gentle, lively], energy: [0.0, 0.8]}}
  fade-dark:  {label: Through dark, kind: fade_dark, out_s: 2.5, in_s: 2.0, tags: {transition_style: [gentle]}}
  sweep:      {label: A sweep across the room, kind: sweep, beats: 2, wave_beats: 4, dark_move: true,
               tags: {transition_style: [lively], energy: [0.3, 0.9], flow: {dirs: [up, down, left, right, cw, ccw,
               outward, inward], honours: true}}}
  # -- Transitions with a gesture of their own (owner, 26 Nov: "gigbar transitions might be all the lights fly up, or
  # all strobe, or all sweep ... scenes with effects over them, and then transitions between scenes"). kind is how
  # the two scenes swap underneath; gesture is what the lights do across the change, in an effect's words (needs,
  # layers, hits, fade), from before_beats ahead of the change's line to after_beats past it. A group the gesture
  # doesn't fit (its needs) just swaps. A strobing gesture fires only where the feel lets strobes fire.
  fly-up:
    label: Every head flies up, and the new scene comes down
    kind: crossfade
    beats: 2
    seconds: 1.5
    gesture:
      before_beats: 2
      after_beats: 2
      fade: {in_beats: 2, out_beats: 2}
      needs: [pan, tilt]
      layers:
        - {id: fly, kind: position, mode: lift, lift: 3.0, flow_dir: up, depth: 1.0}
        - {id: beam, kind: beam, zoom: narrow}
    tags: {transition_style: [lively, wild, gentle], energy: [0.3, 1.0], weight: 1.0}
  sweep-through:
    label: Every head sweeps across the room into the new scene
    kind: crossfade
    beats: 2
    seconds: 1.5
    gesture:
      before_beats: 2
      after_beats: 2
      fade: {in_beats: 1, out_beats: 2}
      needs: [pan, tilt]
      layers:
        - {id: across, kind: position, mode: sweep, on: floor, centre: [dance-floor, centre], along: flow, size: 3.0,
           size_deg: 45, ease: sine, phase: bar, period_bars: [1, 1], needs: none, spread_mode: chase, spread: 0.25}
        - {id: beam, kind: beam, zoom: 12}
    tags: {transition_style: [lively, wild], energy: [0.35, 1.0], weight: 1.0,
           flow: {dirs: [left, right, cw, ccw, outward, inward], honours: true}}
  strobe-through:
    label: A strobe across the change
    kind: crossfade
    beats: 1
    seconds: 1
    gesture:
      before_beats: 1
      after_beats: 1
      fade: {in_beats: 0, out_beats: 0.5}
      needs: [shutter]
      layers: [{id: strobe, kind: shutter, mode: strobe, hz: [4, 8]}]
    tags: {transition_style: [wild, lively], energy: [0.65, 1.0], weight: 0.6}
  pump-through:
    label: The bars pump hard through the change
    kind: crossfade
    beats: 2
    seconds: 1.5
    gesture:
      before_beats: 2
      after_beats: 2
      fade: {in_beats: 1, out_beats: 1}
      layers:
        - {id: pump, fx: swell, phase: beat, subdivide: true, depth: 0.85, needs: none, without_beat: energy,
           attack_ms: 30, decay_ms: 180}
    tags: {transition_style: [lively, wild], energy: [0.4, 1.0], weight: 0.8}
