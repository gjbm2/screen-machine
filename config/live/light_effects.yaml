# Light effects: overlays the director fires over a group's scene on the music's events (docs/LIGHTS.md §6.3;
# show_service/light_scenes.py). Hot-reloaded with light_scenes.yaml (a bad edit keeps the last good effects; the
# problems are under director.lights in GET /show/api/v1/state).
#   on        drop | build | breakdown | peak | section_change | track_change | outro | every_bars
#   every_bars, chance (0..1 per trigger), length {bars|beats|seconds} | while (as long as the phase that fired it)
#   fade {in_beats, out_beats}, needs, layers (§5.2), hits, caps, tags (energy band, moods, flow; weight)
# At most show.yaml lights.programs.effects_max run at once on a group, a new one at most every effect_gap_bars (a drop
# always may). None fire with no feel, under House lights or Lights low, or while Keep this look holds.
# Strobe only lives here. Each light's own strobe_hz_max (set on the Lights page) caps it; Hue never strobes.
# A strobe (a shutter layer, or appliances shutter: strobe) fires only while the feel allows strobes (vibes.yaml
# strobe: true) and pays one of its big moments (peak_tokens_per_hour); strobes on the same line as a paid drop, or
# on another group at the same moment, share that one token (owner, 26 Nov).
# chorus / final_chorus: a karaoke song's choruses, from its lyrics (final_chorus: the last one in the song).
# lead_in | waiting | lull: the room's moment begins (contract.MOMENTS: a song is cued; nothing plays; a long wait);
# song_end: a song has just given way to waiting (the applause). length: while lasts as long as that moment.
# Every number below is a STARTING POINT, chosen on paper: tune by watching the room.
version: 1
effects:
  strobe-burst:
    label: Strobe burst
    on: [drop]
    length: {bars: 1}
    fade: {in_beats: 0, out_beats: 0.5}
    needs: [shutter]
    layers: [{id: strobe, kind: shutter, mode: strobe, hz: [6, 10]}]
    appliances: {shutter: strobe}            # the pinspots' own strobe (show.yaml lights.appliances)
    tags: {energy: [0.7, 1.0], moods: [euphoric, aggressive, glitchy], weight: 1.0}
  drop-flash:
    label: Flash on the drop
    on: [drop]
    length: {beats: 2}
    layers: []
    hits: {styles: [], drop: {depth: 1.0, decay_ms: 600}}
    tags: {energy: [0.5, 1.0], weight: 1.0}
  downbeat-snap:
    label: Snap to a new place each bar
    on: [peak]
    length: while
    needs: [pan, tilt]
    layers: [{id: bar-hop, kind: position, mode: bounce, points: [dance-floor, piano, mirror-ball, centre], hop: bar,
              spread_mode: unison}]
    tags: {energy: [0.65, 1.0], moods: [euphoric, playful], flow: {dirs: [still], honours: false}}
  converge-on-drop:
    label: Every beam to one place on the drop
    on: [drop]
    length: {bars: 1}
    fade: {in_beats: 0, out_beats: 1}
    needs: [pan, tilt]
    layers:
      - {id: aim, kind: position, mode: aim, centre: [mirror-ball, flow, dance-floor, centre]}
      - {id: beam, kind: beam, zoom: narrow}
    tags: {energy: [0.6, 1.0], moods: [euphoric, tense], flow: {dirs: [inward, towards, outward], honours: true}}
  gobo-shake:
    label: Shaking patterns
    on: [build, every_bars]
    every_bars: 8
    chance: 0.4
    length: {bars: 2}
    needs: [gobo]
    layers: [{id: shake, kind: gobo, slot: auto, shake: 0.7}]
    tags: {energy: [0.5, 1.0], moods: [tense, glitchy, playful]}
  prism-burst:
    label: Split beams
    on: [section_change, chorus]
    chance: 0.6
    length: {bars: 2}
    fade: {in_beats: 0, out_beats: 1}
    needs: [prism]
    layers: [{id: prism, kind: prism, in: true, spin: flow, spin_scale: 0.8}]
    tags: {energy: [0.45, 1.0], moods: [euphoric, cosmic, glitchy], flow: {dirs: [cw, ccw], honours: true}}
  colour-bump:
    label: Colour kick on the beats
    on: [section_change, every_bars, chorus]
    every_bars: 16
    chance: 0.5
    length: {bars: 1}
    layers:
      - {id: bump, kind: colour, role: highlight, depth: {fx: swell, phase: beat, between: [0.0, 0.8]}}
    tags: {energy: [0.45, 1.0], moods: [bright, playful, euphoric]}
  peak-chase:
    label: Fast chase
    on: [peak]
    length: while
    fade: {in_beats: 1, out_beats: 2}
    layers: [{id: chase, fx: square, phase: beat, subdivide: true, depth: 0.7, needs: beat, without_beat: energy,
              order: flow, spread: 1.0}]
    tags: {energy: [0.7, 1.0], moods: [euphoric, aggressive], flow: {dirs: [left, right, cw, ccw], honours: true}}
  up-wave:
    label: Light climbing upwards
    on: [build]
    length: while
    fade: {in_beats: 2, out_beats: 1}
    layers:
      - {id: climb, fx: saw, phase: beat, depth: 0.6, needs: grid, without_beat: energy, order: flow, flow_dir: up,
         spread: 1.0}
      - {id: lift, kind: position, mode: lift, lift: 2.0, flow_dir: up, depth: 0.8}
    tags: {energy: [0.4, 1.0], moods: [tense, euphoric], flow: {dirs: [up], honours: false}}
  down-wave:
    label: Light falling away
    on: [breakdown, outro]
    length: {bars: 4}
    fade: {in_beats: 1, out_beats: 4}
    layers:
      - {id: falling, fx: saw, phase: bar, depth: 0.5, needs: grid, without_beat: energy, order: flow, flow_dir: down,
         spread: 1.0}
      - {id: sink, kind: position, mode: lift, lift: 1.5, flow_dir: down, depth: 0.6}
    tags: {energy: [0.1, 0.7], moods: [dreamy, dark, calm], flow: {dirs: [down, inward], honours: false}}

  # -- appliances (owner, 28 Oct): the glitterball and pinspots (show.yaml lights.appliances; light_scenes.yaml) -----
  spin-up:
    label: The glitterball speeds up
    on: [build]
    length: while
    appliances: {pan_spin: {speed: 1.0, dir: flow}}
    tags: {energy: [0.5, 1.0], moods: [tense, euphoric]}
  strobe-peak:
    label: Pinspots strobe through the peak
    on: [peak]
    length: {bars: 4}
    needs: [shutter]
    appliances: {shutter: strobe}
    tags: {energy: [0.8, 1.0], moods: [euphoric, aggressive, fiery]}
  strobe-peak-lights:
    label: Strobe hit at the peak
    on: [peak]
    length: {bars: 1}
    fade: {in_beats: 0, out_beats: 0.5}
    needs: [shutter]
    layers: [{id: strobe, kind: shutter, mode: strobe, hz: [4, 8]}]
    tags: {energy: [0.8, 1.0], moods: [euphoric, aggressive, fiery]}
  last-chorus-strobe:
    label: Strobe into the last chorus
    on: [final_chorus]                      # the only effect on it, so the last chorus always lands (one moment)
    length: {bars: 2}
    fade: {in_beats: 0, out_beats: 1}
    needs: [shutter]
    layers: [{id: strobe, kind: shutter, mode: strobe, hz: [4, 8]}]
    hits: {styles: [], drop: {depth: 1.0, decay_ms: 600}}
    tags: {energy: [0.0, 1.0], weight: 1.0}
  # -- the room's moments (owner, 26 Nov: commissioned like any effect, written here, not in code) --
  song-end-open:
    label: The heads open out to the room as a song ends
    on: [song_end]
    length: {seconds: 6}
    fade: {in_beats: 2, out_beats: 6}
    needs: [pan, tilt]
    layers:
      - {id: out, kind: position, mode: fan, centre: [dance-floor, centre], on: floor, along: flow, size: 2.5,
         size_deg: 40, fan: 1.0}
      - {id: beam, kind: beam, zoom: wide}
    tags: {energy: [0.0, 1.0]}
  song-end-twinkle:
    label: A twinkle along the bars for the applause
    on: [song_end]
    length: {seconds: 5}
    fade: {in_beats: 0, out_beats: 4}
    layers:
      - {id: twinkle, fx: square, phase: beat, subdivide: true, depth: 0.6, needs: none, without_beat: energy,
         order: flow, spread: 1.0}
      - {id: bump, kind: colour, role: highlight, depth: {fx: swell, phase: beat, between: [0.0, 0.8]}}
    tags: {energy: [0.0, 1.0]}
  # -- commissioned only (on: [transition] never fires by itself): a move's accents (config/live/moves.yaml) --
  strobe-hit:
    label: A beat of strobe
    on: [transition]
    length: {beats: 1}
    fade: {in_beats: 0, out_beats: 0.25}
    needs: [shutter]
    layers: [{id: strobe, kind: shutter, mode: strobe, hz: [4, 8]}]
    tags: {energy: [0.0, 1.0]}
  bars-kick:
    label: The bars kick on every beat for two bars
    on: [transition]
    length: {bars: 2}
    fade: {in_beats: 0, out_beats: 2}
    layers:
      - {id: kick, fx: swell, phase: beat, depth: 0.85, needs: none, without_beat: energy, attack_ms: 30,
         decay_ms: 200}
      - {id: bump, kind: colour, role: highlight, depth: {fx: swell, phase: beat, between: [0.0, 0.8]}}
    tags: {energy: [0.0, 1.0]}
  # -- the laser's own (tags.parts: [laser]: they play on a group that takes that part, and no other). A grating
  # burst (light_scenes.yaml has what it is): no gating faster than its 0.25 s pulse, its strobe under 4 a second.
  # Only laser-burst lights more than one diode: every colour of beam at once, for the song's one big moment
  # (Laser: 240 is the 52-channel chart's red + green + blue; Laser control: 20 the 51-channel chart's image colour).
  laser-burst:
    label: Every colour of beam at once, spinning and strobing, for the big moment
    on: [drop, final_chorus, transition]
    length: {bars: 2}
    fade: {in_beats: 0, out_beats: 1}
    needs: [shutter]
    layers:
      - {id: all-diodes, kind: macro, set: {Laser: 240, "Laser control": 20,
                                            "Laser rotation": {cw: 120, ccw: 250, still: 100}, "Laser patterns": 250}}
      - {id: strobe, kind: shutter, mode: strobe, hz: [2, 4]}
    tags: {parts: [laser], energy: [0.5, 1.0], moods: [euphoric, aggressive, fiery, glitchy, bright]}
  laser-sweep-in:
    label: The burst comes on, turning, as the chorus opens
    on: [chorus, transition]
    length: {bars: 4}
    fade: {in_beats: 0, out_beats: 2}
    layers:
      - {id: rotation, kind: macro, set: {"Laser rotation": {cw: 70, ccw: 200, still: 50}, "Laser patterns": 140}}
    tags: {parts: [laser], energy: [0.4, 1.0], moods: [euphoric, playful, bright, cosmic]}
  laser-cut-out:
    label: The laser cuts out for two beats
    on: [transition]
    length: {beats: 2}
    fade: {in_beats: 0, out_beats: 0}
    layers:
      - {id: dark, fx: dim, phase: time, period_s: 1, depth: 1.0, needs: none}
    tags: {parts: [laser], energy: [0.0, 1.0]}
  laser-spin-up:
    label: The burst spins up through a build
    on: [build]
    length: while
    fade: {in_beats: 1, out_beats: 1}
    layers:
      - {id: fast, kind: macro, set: {"Laser rotation": {cw: 127, ccw: 255, still: 127}}}
    tags: {parts: [laser], energy: [0.5, 1.0], moods: [tense, euphoric, aggressive]}
