# Ambient's scene SET (owner, 28 Oct: "upgrade the ambient mode scene set to use tags in a smart insightful way"):
# the gallery looks above as Ambient variants.  Each shows the screen's library pictures that fit the music (pool
# library, match music: the art director's wish, the pictures' tags, held per song) with its own effect, pace and
# ladder; with gallery-ambient and gallery-ambient-lively they are Ambient's closed set (modes: [ambient]), and the
# director picks among them by energy, the music's band moods and genre: ghosts and the contact sheet for calm music
# and jazz, show colours for soul and funk, little planets and the kaleidoscope for lively pop and electronic.
gallery-ambient-ghosts:
  label: "Ambient: ghosts"
  source: gallery
  params: {pace: bar, ladder: 16-8-4, pool: library, match: music, style: soft, quality: full, hold_s: 30.0,
           hold_fast_s: 12.0, transition_s: 4.0, transition_fast_s: 3.0, drift: 0.4, drift_rate: 0.6,
           energy: {bind: activity_slow, range: [0.0, 1.0]}, pulse: {bind: beat, range: [0.0, 0.3]}}
