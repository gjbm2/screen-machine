# Effect presets for stream_service (hot-reloaded; EFFECTS_LAYER_DESIGN A.3, D).
#   <preset-name>: {label, effect: <plug-in name>, params: {<only what differs from the plug-in defaults>}, tags}
# Effects run on top of a scene (a scene spec's `effects` list) or on the master FX bus (PUT /api/sessions/{id}/fx).
# amount 0 is identity; the engine fades effects in and out through it.  `pulse` is bound to the beat by default
# (give it a value to switch that off).  Params may be bindings: {bind: <signal>, range: [lo, hi], rest?}.
# tags: {energy: [lo, hi], moods, style: [gentle|lively|wild], technique, weight}.  The FX director (auto.fx) picks
# only tagged presets, at most one per stage, matching direction.energy, moods and transition_style.

chroma-soft:
  label: Chroma (soft)
  effect: chroma
  params: {amount: 0.5, spread: 0.006, punch: 1.2}
  tags: {energy: [0.2, 0.8], moods: [dreamy, playful, bright], style: [gentle, lively], technique: [optical], weight: 1.0}

chroma-punch:
  label: Chroma (beat punch)
  effect: chroma
  params: {amount: 0.8, spread: 0.012, punch: 3.0}
  tags: {energy: [0.55, 1.0], moods: [euphoric, tense, aggressive], style: [lively, wild], technique: [optical], weight: 0.8}

shake-beat:
  label: Shake (on the beat)
  effect: shake
  params: {amount: 0.7, max_shift: 0.012, sway: 0.1, punch: 1.2}
  tags: {energy: [0.5, 1.0], moods: [euphoric, aggressive, tense, playful], style: [lively, wild], technique: [displacement], weight: 1.0}

shake-sway:
  label: Sway (slow drift)
  effect: shake
  params: {amount: 0.6, max_shift: 0.008, max_rotate: 0.6, sway: 0.6, punch: 0.2, frequency: 0.6}
  tags: {energy: [0.0, 0.5], moods: [dreamy, calm, hypnotic, mellow], style: [gentle], technique: [displacement], weight: 0.8}

hue-drift-slow:
  label: Hue drift (slow)
  effect: hue_drift
  params: {amount: 0.6, rate: 0.03, saturation: 1.1, punch: 0.2}
  tags: {energy: [0.0, 0.6], moods: [dreamy, hypnotic, calm, playful], style: [gentle], technique: [colour], weight: 1.0}

hue-drift-rave:
  label: Hue drift (rave)
  effect: hue_drift
  params: {amount: 0.9, rate: 0.2, saturation: 1.35, punch: 1.2}
  tags: {energy: [0.6, 1.0], moods: [euphoric, playful, bright], style: [lively, wild], technique: [colour], weight: 0.7}

grade-warm:
  label: Grade (warm)
  effect: grade
  params: {amount: 0.8, saturation: 1.15, contrast: 1.05, warmth: 0.55}
  tags: {energy: [0.0, 0.7], moods: [warm, mellow, dreamy], style: [gentle], technique: [colour], weight: 1.0}

grade-cool:
  label: Grade (cool)
  effect: grade
  params: {amount: 0.8, saturation: 1.05, contrast: 1.1, warmth: -0.5}
  tags: {energy: [0.0, 0.7], moods: [cool, calm, dark], style: [gentle], technique: [colour], weight: 0.9}

grade-mono:
  label: Grade (mono, contrasty)
  effect: grade
  params: {amount: 1.0, saturation: 0.0, contrast: 1.35, lift: 0.02}
  tags: {energy: [0.2, 0.8], moods: [dark, tense], style: [lively], technique: [colour], weight: 0.5}

grade-punch:
  label: Grade (vivid, flashes on the beat)
  effect: grade
  params: {amount: 1.0, saturation: 1.45, contrast: 1.2, flash: 0.8}
  tags: {energy: [0.5, 1.0], moods: [bright, euphoric, playful], style: [lively, wild], technique: [colour], weight: 0.8}

flash-kick:
  label: Flash (on the kick)
  effect: flash
  params: {amount: 0.7, strength: 0.5, screen: 0.85}
  tags: {energy: [0.55, 1.0], moods: [euphoric, aggressive, bright], style: [lively, wild], technique: [light], weight: 0.9}

flash-glow-warm:
  label: Warm glow (soft beat flash)
  effect: flash
  params: {amount: 0.5, strength: 0.3, glow: 0.08, tint: "#ffb070", screen: 1.0}
  tags: {energy: [0.2, 0.7], moods: [warm, mellow, euphoric], style: [gentle, lively], technique: [light], weight: 0.7}
