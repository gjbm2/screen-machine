    christmas: 0.85
    children: 0.8
    hopeful: 0.8
    inspiring: 0.8
    motivational: 0.8
    groovy: 0.75
    love: 0.7
    romantic: 0.7
    sexy: 0.65
    travel: 0.65
    energetic: 0.65
    retro: 0.6
    adventure: 0.6
    calm: 0.55
    relaxing: 0.55
    melodic: 0.55
    nature: 0.55
    soft: 0.5
    dream: 0.5
    meditative: 0.45
    epic: 0.45
    powerful: 0.45
    ballad: 0.4
    space: 0.4
    emotional: 0.35
    slow: 0.35
    deep: 0.35
    drama: 0.3
    dramatic: 0.3
    heavy: 0.25
    dark: 0.1
    melancholic: 0.1
    sad: 0.0
  key_min_strength: 0.3                     # Essentia's key is used at this strength or more...
  key_hold:                                 # ...and music.context's key doesn't flicker:
    strength_margin: 0.05                   # the worker's key stays the source until its strength is this far under
    hold_s: 4                               # another key (or none) shows after holding this long (the piano's at once)
  events:
    min_lead_s: 1.1                         # §5.4: events lead the screens' live lead (0.55-0.85 s) + 250 ms
  track:                                    # §6.1 track changes (Sonos now-playing is the truth when it plays)
    gap_s: 3                                # a silence this long...
    gap_gate: 0.05                          # ...(the loudness gate under this, or...
    gap_lufs_m: -60                         # ...the momentary loudness at or under this: a line at rest. The gate
                                            # follows the 3 s loudness, so alone it missed gaps under ~6 s)...
    window_s: 20                            # ...then a boundary this soon after the sound returns, with a jump in:
    tempo_jump: 0.04                        # tempo (over 4 %, not x2 or x0.5),
    key_min_conf: 0.3                       # key (at this strength both sides; the same, parallel or relative key is
                                            # no jump),
    parent_window_s: 5                      # or the genre parent: the leader of the last 5 s of tags...
    parent_margin: 0.05                     # ...leading the next by this (a near tie is no evidence)
    spike_k: 2.0                            # without a gap: a novelty peak this many times the threshold (null: off)...
    spike_jumps: 2                          # ...with this many of the jumps at once (the genre by its smoothed leader)
    # Song ends (README S5.17, owner 17 Oct): room.event track_end_armed / track_end, so the director can choose the
    # change's transition. Starting points, all of them.
    end_gap_s: 3                            # a silence (gap_gate / gap_lufs_m, as above) this long after music is a
                                            # song's end: track_end via dsp at the gap's start (shorter: a rest inside
                                            # the song; none while Sonos plays a song whose end is further than arm_s)
    arm_s: 20                               # Sonos now-playing (playing, with a duration): track_end_armed this long
                                            # before the predicted end...
    rearm_s: 0.5                            # ...re-sent when the predicted end moves more than this
    end_slack_s: 3                          # another Sonos track id, or a stop, this close to the armed end is the end
                                            # (Sonos is read every 2 s, positions are whole seconds); earlier: a skip.
                                            # Also how long sound after a Sonos end waits for the next track's id
                                            # before track_end "sound_back"
    first_sound_s: 10                       # a Sonos track change in silence waits this long for the new song's first
                                            # sound (its at_ms), then goes anyway
    piano_rest_s: 15                        # the piano's MIDI vouches for the piece while a key or the damper is down
                                            # or a note came this recently: no song end (this gap, cues' stop and
                                            # fade). Measured 21 Oct: practice rests 2.5-12.2 s; each one went dark
                                            # (owner: "flips to black regularly"). 0: off (the mic alone decides)
  build:                                    # §6.2 (needs a clock grid: no builds or drops without one)
    window_s: 12                            # §6.2: over 8-16 s...
    min_slope: {lufs_db_s: 0.15, brightness_s: 0.004, onset_rate_s: 0.05}   # ...loudness, centroid, onsets rising...
    low_max_slope_db_s: 0.05                # ...while 20-250 Hz is held or falling
    full_rise_db: 6                         # build_progress without a predicted line: the rise so far / this
    phrase16_conf: 0.5                      # §6.2: the drop line is the next 16-bar line at this phrase_conf, else 8
    arm_beats: 8                            # drop_armed goes out this far ahead (and at least 2 beats, min_lead_s)
    foot_db: 0.5                            # a build starts at the last sample within this of its window's quietest
  drop:
    low_jump_db: 6                          # §6.2: the bass band jumps more than ~6 dB...
    lufs_jump_db: 3                         # ...with a loudness jump...
    within_beats: 1                         # ...within one beat after a build (or of the armed line)
    hold_bars: 8                            # phase "drop" this long, then peak or calm
    snap_beats: 0.25                        # README S4.7: a drop is snapped to the nearest beat within this
    disarm_bars: 1                          # a build that ends more than this before its armed line calls the line off
                                            # (closer: a pre-drop break; the line lands; the same as director dip_bars)
  breakdown:
    low_drop_db: 9                          # §6.2: bass and percussion collapse...
    perc_ratio_max: 0.25
    min_gate: 0.3                           # ...while the music carries on...
    for_s: 4                                # ...for this long
    leave_s: 4                              # left once that has failed this long (never faster out than in)
  peak: {energy_min: 0.75, for_s: 4, leave_s: 4}     # after a drop, or in the chorus; in after for_s, out after leave_s
  outro: {window_s: 16, max_slope_db_s: -0.25, energy_max: 0.4, for_s: 2, leave_s: 2}
  fastled:                                  # FastLED's audio detectors (MIT; fl/audio/detector), their own numbers
    build_end: 0.5                          # BuildupDetector: a build ends under this x its start slope
    drop_weights: [0.40, 0.35, 0.15, 0.10]  # DropDetector's impact blend: loudness flux, bass flux, band change, level
    band_weights: [0.5, 0.3, 0.2]           # its band change: bass, mid, treble
    drop_cooldown_s: 2                      # mMinTimeBetweenDrops

# ---- Stage 5 (README "Stage 5"; S5.10 lists these keys) ---------------------------------------------------------------
# The rig: the fixture registry (config/room/fixtures.yaml), the look engine (looks.py) and the output drivers
# (hue_out.py, artnet_lan.py). Every output is OFF until fixtures.yaml enables it; these keys only say how the engine
# and the drivers behave once one is on. The screens stay on the virtual Maestro until P4 (README S5.9).
rig:
  enabled: true                             # false: no registry, look engine or outputs at all (the rollback;
                                            # hot-reloaded). Every output is also off until fixtures.yaml enables it.
  artnet:                                   # artnet_lan.py (§9.3)
    poll_s: 3                               # §9.3: a unicast ArtPoll every 3 s to each node an enabled output uses
    keepalive_s: 1                          # §9.3: an unchanged universe goes out again at least this often
    idle_eval_hz: 10                        # starting point: how often an idle output's look is checked for a change
    silent_after_s: 10                      # starting point: a node with no ArtPollReply this long reads "silent"
                                            # (health only: frames keep going)
    reply_bind: null                        # unset: ArtPollReplies only through our own socket (WSL NAT). Nodes answer
                                            # on PC22's udp 6454, which ca's relay forwards to room_service's receiver;
                                            # once ca also forwards OpPollReply to a show_service port, its "host:port"
                                            # goes here (registered in docs/PORTS.md first; README S5.7)
  hue:                                      # hue_out.py (§9.4)
    takeover_check_s: 2                     # room's own rule (room_service/hue/output.py): who holds the area, every 2 s
    start_wait_s: 3                         # starting point: an area another streamer holds is waited for this long,
                                            # then taken_over (never fight)
    release_settle_s: 1.0                   # §9.4: the bridge's own post-entertainment write lands before "released"
    release_timeout_s: 15                   # starting point (room's hue adapter waits 20 s for the answer)
    error_backoff_s: 5                      # room's own rule (room_service/hue/output.py)

looks:                                      # the look engine (looks.py; §9.1). Lamps and DMX only: a kind-screen
                                            # fixture never gets a level, layer, hit, master or cap (the screens rule).
  align_pct: 25                             # §5.5: aim at the perceived onset (~t20-t30) of each measured edge,
                                            # interpolated between latency.json's t10 and t50
  min_visible_ms: 40                        # starting point: a pulse's visible width; §5.4: a pulse lasts at least
                                            # L_rise - L_fall + this
  middle_depth: 0.5                         # starting point (§5.4 "Middle"): with the clock's gate at dmx, beat layers
                                            # run only on outputs that take hits, at this x their depth
  master: 1.0                               # lamps and DMX only, never screens
  caps:                                     # §8.2 L5: optional, off unless set
    flash_hz_max: null                      # an intensity rise of more than 0.5 at most this often per fixture
  # Layers on top of the director's colours (palette_fn), each fixture evaluated at t_send + its own latency.
  # Intensity: the highest wins (HTP); colour: the latest layer that sets it (LTP). An oscillator multiplies its
  # fixtures' intensity by 1 - depth + depth x shape.
  layers:
    - id: pulse                             # the lamps' beat swell, exactly the virtual Maestro's (artnet_out.py)
      attr: intensity
      fx: swell                             # attack up to the beat, then decay
      phase: beat
      subdivide: true                       # x the look's accents.subdivision (1, 1/2, 1/4 or 1/8 of a beat)
      depth: swell                          # the director's set_look_out depth (director.accent_depth by the accents
                                            # style; 0 while relaxed, House or Low); with no vibe, artnet_out's 0.7
      needs: beat
      without_beat: energy                  # no beat, or beat_lock false: the depth follows the smoothed energy, as
                                            # artnet_out's swell does ("none": steady)
      attack_ms: 80                         # §5.4 (artnet_out's HUE_ATTACK_S); an output's min_attack_ms raises it
      decay_ms: 250                         # starting point (artnet_out's HUE_DECAY_S)
      select: "kind:lamp"
    - id: motion                            # slow movement inside a look: a wave round an ordered group
      enabled: false                        # off: the lamps look as they do through the virtual Maestro today. Tune by
                                            # ear, then turn on (hot-reloaded)
      attr: intensity
      fx: sine
      phase: bar
      period_bars: [8, 1]                   # starting point: the look's motion.speed 0 -> 8 bars, 1 -> 1 bar
      depth: motion.amount
      depth_scale: 0.3                      # starting point
      spread: look.spread                   # 0: unison .. 1: one whole cycle across the group
      needs: none                           # on the clock's bars when it has a grid, else on time
      select: "group:around"
  hits:                                     # music.hit -> a short flash, only on outputs whose driver takes hits (DMX,
                                            # never Hue: §5.4)
    select: "kind:lamp"
    styles: [beat, full]                    # starting point: only while the look's accents style is one of these
    # bands: [sub, bass]                    # unset: every band
    min_strength: 0.3                       # starting point
    depth: 0.5                              # starting point: the flash reaches level + this x strength (HTP)
    decay_ms: 120                           # starting point

# ---- Lights: groups, flow, motion, the jog and calibration (docs/LIGHTS.md). Starting points unless marked. -----------
lights:
  scene_group: lamps                        # room.look's light_scene (compat) is this group's scene
  groups:                                   # a light runs the program of the FIRST group here that selects it
    movers:
      label: Moving lights
      select: "cap:pan"
      dark_level: 0                         # fade_dark goes to this (0..1), or floor (the look's floor)
    lamps:
      label: Lamps
      select: "kind:lamp"
      dark_level: floor
    # movers-north: {label: North movers, select: "cap:pan side:north", follows: movers}   # put above movers
  programs:
    effects_max: 2                          # effects running at once per group
    effect_gap_bars: 4                      # a new effect at most this often per group (a drop always may)
  flow:
    centre: null                            # a Room map name the flow turns round / bursts from; null: the room's centre
    sources: {structure: 1.0, pitch: 0.6, listener: 0.5, moods: 0.3}
    structure: {build: up, peak: cw, drop: outward, breakdown: inward, outro: down, calm: still}
    listener: {building: up, peak: outward, releasing: down, winding_down: inward}
    moods: {euphoric: up, bright: up, cosmic: cw, hypnotic: cw, liquid: right, dreamy: still, calm: still,
            dark: down, tense: inward, aggressive: outward}
    pitch: {window_s: 4, slope: 0.03, min_conf: 0.5}   # register (A0 0 .. C8 1) per second that reads as rising
    events:
      drop: {dir: outward, bars: 1, then: down}
      build: {dir: up}
      track_change: {sweep_beats: 4}
    min_score: 0.25
    margin: 0.15
    dwell_s: 8
    still_below_energy: 0.15
    cross_beats: [16, 2]                    # the wave's crossing time at speed 0 .. 1 (powers of two)
    cross_s: [8, 1]                         # the same without a clock grid
    speed: {pace: 0.6, energy: 0.4}
    spread: look.spread
    coherence: {events: 1.0, floor: 0.3}
    symmetry: none                          # none | mirror
    mirror_ball:
      enabled: true                         # it turns the glitterball with the flow; it never switches it on
      power_member: mirror_ball.main
      power_on: spinning
      direction_target: mirror_ball_motor.direction
      speed_target: mirror_ball_motor.speed
      directions: {cw: clockwise, ccw: anticlockwise}   # cw = clockwise seen from ABOVE: check by eye, swap if wrong
      speeds: [[0.0, low], [0.4, medium], [0.75, high]]   # flow.speed from -> the remote's speed word
      min_gap_s: 120                        # §9.3: one change at most this often (the motor reverses)
    blinds:
      enabled: false                        # true: big song changes move the blinds with an up/down flow
      # targets: {<room target>: {up: <value>, down: <value>}}   # from modes.json's blinds; set them first
  motion:
    default_max_speed_deg_s: {pan: 180, tilt: 120}   # until measured (each light's own max_speed wins)
    accel_s: 0.12
    pt_speed: 1.0                           # the light's own pan/tilt speed channel (1 = fastest; the engine smooths)
    max_travel_share: 0.8                   # a beat-locked hop may spend at most this share of its period moving
    dark_move_min_deg: 30                   # a jump bigger than this travels dark when the transition says so
    settle_ms: 120
    min_size_share: 0.4                     # a pattern too fast for a light shrinks to this, then slows
    dark_max_s: 8                           # fade_dark never stays dark longer (director.track_transitions.gap's)
  jog:
    idle_s: 60                              # Move it hands the light back after this long with no moves
    smooth_ms: 80
    send_hz: 20
    nudge_deg: {fine: 1, coarse: 5}
    drag_deg_per_px: {fine: 0.1, coarse: 0.5}
  calibration:
    fit_deg: [1.5, 4.0, 8.0]                # good | ok | rough edges of the solve's rms error
    min_spread_deg: 20                      # taught points closer than this together: "point it at places further apart"
    pos_sigma_m: 0.3                        # how far the solve may move a light from where the map puts it
