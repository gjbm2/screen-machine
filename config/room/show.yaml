# Sections, builds and drops (§6.1, §6.2; structure.py). Starting points, all of them: README S4.7's. B10 checked
# FastLED's own detector thresholds (per-frame relative-energy units) and they don't translate to these dB/s slopes, so
# these stand; FastLED's own numbers are under fastled, where the port uses them as they are.
structure:
  gobo_on_sections: true                    # §9.5: GOBO steps once per section change (the screens' scene change)
                                            # while no vibe plays; with a vibe the director steps it when a look lands
  novelty:
    recent_s: 4                             # §6.1: 1 - cos(mean(the last 4 s), mean(the 15 s before))
    before_s: 15
    k_mad: 3.0                              # a boundary is a peak over the median + k x MAD of the last history_s...
    history_s: 120
    min: {ml: 0.05, dsp: 0.10}              # ...and over this, per descriptor (embeddings or chroma + MFCC)
    peak_s: 3                               # a local maximum over +-3 s
  dsp_weights: {chroma: 0.5, mfcc: 0.5}     # the descriptor without the worker
  min_section_bars: 8                       # boundaries closer than this are one
  min_section_s: 12                         # ...the same without a bar grid
  identify_after_s: 8                       # a new section is named (a repeat, or a new letter) after this long
  repeat_sim: {ml: 0.85, dsp: 0.80}         # centroid cosine that makes "A again"
  max_sections: 64                          # remembered per track
  predict_lead_bars: 1                      # a known repeat's end is announced this far ahead (§8.5)
  grid_conf: 0.5                            # README S4.7: the clock's bar_conf at which its bar lines are used
  same_bars: 2                              # a confirmed boundary this close to a predicted line, a drop or a new track
                                            # is the same boundary
  phase_dwell_s: 2                          # the phase word holds at least this long (drop, build and breakdown show
                                            # at once: an event announces each)
  tags_tau_s: 20                            # §6: music.context's numbers and instruments smoothed (10-60 s)
  tags_hold_s: 30                           # ...and read null once the tags are this old
  ced_mean_s: 3                             # README S4.8: music.context's CED is the mean of the last 3 s
  listener_conf: 0.6                        # the AI listener's moods and section label count at this confidence
  mood_energy:                              # music.context mood_energy, 0 (calm) .. 1 (energetic): the mood head's top
