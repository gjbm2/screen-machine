# config/room/show.yaml: show_service's own settings (docs/SHOW_ENGINE.md; show_service/README.md, "Stage 3" and
# "Stage 4"; S4.9 lists the Stage-4 keys: ml, genre_map, structure, and new keys under situations, listener and
# director. Nothing reads a Stage-4 key until the Stage-4 code is deployed). Stage 5 (README S5.10) adds rig, looks
# and two director.screens keys; nothing reads them until the Stage-5 code is deployed.
# Owner: screen-machine-c8. show_service re-reads this file when it changes (mtime, every 2 s). A bad edit keeps the
# last good settings, and GET /show/api/v1/state shows the error under brain.settings.error.
#
# Not in this file:
#   - Auto's globals and per-mode rules: config/room/modes.json ("autopilot"; aa validates the keys).
#   - Auto on/off: the room target autopilot.main.
#   - The vibes: config/room/vibes.yaml.
#   - Put-back: the room's per-row {"set": v, "restore": true}.
#   - Model ids, prices and budgets: config/llm.yaml.
#   - Latency trims: config/room/latency.json.
#   - The fixtures' layout: config/room/patch.yaml (68's: the virtual Maestro's universe and room's Hue block) and,
#     from Stage 5, config/room/fixtures.yaml (c8's: the registry, the outputs and their on/off switches).
#
# Device addresses live here, in config/room/, like sonos.json (owner ruling, 16 Oct). Code never holds one.
# EVERY NUMBER IN THIS FILE IS A DESIGN DEFAULT, a starting point to be tuned by ear (the § says where it comes from),
# unless its comment says "measured" or "owner". Names (streams, targets, hosts) are this room's facts. Anything left
# out takes the neutral value listed in the README, or the code's own starting point (the same numbers as here).
# YAML note: on/off/yes/no are booleans in this parser, so write true/false.

version: 1

# VBAN senders that show_service subscribes to. It sends a SUBSCRIBE every second; the sender streams back to that
# address (§3.1). hosts are tried in order. A host that has answered within 3 s gets the SUBSCRIBEs alone; until one
# answers, every host gets them. One box with two addresses still streams once, because a sender replies to the
# latest SUBSCRIBE.
# on_demand: true means the sender is subscribed only while POST /show/api/v1/test runs that source.
# room_sound: false means its audio can't carry anyone in the room (a music file): the listener skips the music/speech
#   check for it. Nothing else changes: every upload still needs AI listening on and a mode that listens. Leave it out
#   (or true) for anything with a microphone.
# Senders given with --sender / SHOW_SENDERS (deploy/sm-show.env) still apply. This file wins for a name in both.
# A room mic (a stream of a sender that isn't on_demand or room_sound: false, other than MIDI and test streams)
#   captures only while something needs it: Auto is on, or the mode follows the music. The Room page's Mute wins.
#   Otherwise its sender keeps it closed (README S5.16, show_service/mic.py).
senders:
  # LIVE 18 Oct (owner: "plug the MIDI cable / a mic into the mini-PC and it Just Works"): the kiosk's show-sender
  # (a systemd --user unit, tools/show_sender/deploy.sh) sends the Steinway's USB MIDI and a USB mic whenever they are
  # plugged in; with neither, its heartbeats say no_device. The mic still captures only on demand (mic.py).
  kiosk:                                    # screen-machine-drawingroom, 98's show_sender.py
    hosts: ["192.168.1.10", "192.168.1.92"] # Ethernet over powerline (primary since 13 Oct), then Wi-Fi (docs/PORTS.md)
    port: 6980
    streams: [room-mic, room-piano]
    label: Drawing room                     # the Room page's Mic list groups this sender's inputs under it
  pc22:                                     # a PC22 mic (the Dell monitor's: the Insta360 lags 134-148 ms) until the
    hosts: ["192.168.1.205"]                # kiosk's arrives: tools/show_sender/pc22_agent.py on Windows, run by
    port: 6984                              # Spectre's audio-agent card (d4, 16 Oct; SHOW_ENGINE §3.2 "PC22")
    streams: [pc22-mic]
    label: PC22                             # the Room page's Mic list groups this sender's inputs under it
  test-piano:                               # 98's test piano (tools/show_sender --test-piano), a child of show_service
    hosts: [localhost]
    port: 6981
    streams: [test-piano]
    on_demand: true
  test-audio:                               # a music file as VBAN (python -m show_service.sources audio), a child
    hosts: [localhost]
    port: 6982
    streams: [test-audio]
    on_demand: true
    room_sound: false                       # a Creative Commons track, never the room

# The two test sources: POST/DELETE/GET /show/api/v1/test {source: piano | audio, piece}. They exercise the room
# from another room (§10.1). A restart stops them; they are never persisted. Auto's words ignore them (include_test).
tests:
  piano:
    sender: test-piano                      # the senders entry above
    pieces: config/live/test-piano          # .mid files, plus stream_service/piano_replay.py's built-in patterns
  audio:
    sender: test-audio
    music: ~/.cache/screen-machine/test-music   # filled by tools/show/fetch_test_music.py (Creative Commons tracks)
    rank_first: true                        # while it plays, test-audio outranks the room mic (Receiver.set_priority)

room:
  url: http://127.0.0.1:8700                # room_service (in the Flask process) over loopback; its /api/v1/* only

# What each Auto situation reads (§8.9). These name show_service's inputs, never a mode. A mode's condition may
# override any of them for one rule, e.g. {"piano_playing": {"for_s": 10, "min_notes": 20}}.
situations:
  midi:                                     # piano_playing, piano_idle; also the MIDI state channels (__main__)
    streams: [room-piano]                   # the MIDI streams that count. test-piano, phone-test and pc22-* never do
                                            # unless they are listed here or a rule sets include_test: true.
    channels: [1]                           # the adsilent: channel 1 is the keys; 2 is its own playback (ignored)
    heard_by: room-mic                      # while this audio stream is up, the mic must hear the piano too, so silent
                                            # headphone practice never switches; null turns that check off
    window_s: 10                            # starting point (§8.9)
    min_notes: 12                           # starting point
    min_span_s: 6                           # starting point
    min_pitches: 4                          # starting point
    heard_min_lufs: -55                     # measured 20 Oct (NEEWER UM04 on the console, room-mic): the acoustic piano's
                                            # 10 s max short-term loudness was -43..-52 over 98 s of playing (median
                                            # lufs_s -51); the quiet room reads -58..-70. -45 failed most real playing.
    idle_note_s: 1.0                        # starting point: piano_idle needs no note-on for this long
  music:                                    # music_audible
    stream: room-mic
    min_prob: 0.5                           # starting point: CED's music (the ML worker, Stage 4). Without the
                                            # worker, a DSP guess: a steady beat or a clear key, over the gate.
    dsp_min_gate: 0.3                       # starting point
  sonos:                                    # sonos_playing; music_audible's Sonos path
    now_playing: sonos.drawing-room.now_playing     # room targets (sonos.json zone "drawing-room")
    volume: sonos.drawing-room.volume
    own_change_s: 60                        # starting point: ignore Sonos this long after the room itself sent it
                                            # anything (sent_age_s)
  quiet:                                    # quiet
    stream: room-mic
    gate_below: 0.05                        # starting point
    music_below: 0.2                        # starting point (Stage 4): with the ML worker's CED, the room is also quiet
    speech_below: 0.2                       # when music and speech are both under these (only noise over the gate)
  talking:                                  # talking (Stage 4: CED in the ML worker; unknown without it)
    stream: room-mic
    min_prob: 0.5                           # starting point (§8.9): CED speech at least this...
    music_below: 0.5                        # ...with music under this (§8.9: speech with no music)
    speech_words: [speech, conversation, crowd]   # starting point: "speech" is the max of these CED words (babble
                                            # and chatter count, not only Speech); talking, quiet and the genre's
                                            # speech scale read this list
  ced:                                      # Stage 4: the CED classifier that talking, quiet and music_audible read
    window_s: 3                             # README S4.8: the mean of the readings in the last 3 s
    hysteresis: 0.05                        # starting point: a CED word that holds keeps holding until its number is
                                            # back past its threshold by this much
  light:                                    # light_below, light_above (README S5.19): the room's light sensor
    url: "http://127.0.0.1:5000/api/lightsensor/lightsense"   # Flask's own light sensor route; null: the light
                                            # words read unknown
    sensor: living-room                     # the sensor a rule reads when it names none (the route's only one today)
    poll_s: 10                              # starting point: one read of the route every 10 s (2 s timeout, async)
    smooth_s: 60                            # starting point: the median over the last minute, so someone walking past
                                            # the sensor doesn't flip it
    hysteresis: 0.15                        # starting point: "darker than 50 lux" stays true until above 57.5, and
                                            # "brighter than 200" until under 170

# Lamp roles (§8.8). The role comes from each lamp's patch.yaml placement; the role's behaviour is the fields below.
# Every value is a number, or the name of a vibe field to take it from. dynamics (README S5.18): the role's weight W
# in the composer (director.compose): how strongly its lamps answer the music's loudness (starting points).
lamps:
  placement_roles:
    above: extend                           # above a screen: it extends that screen's colours
    opposite: key                           # opposite: the room's key light
  default_role: extend                      # a lamp with no placement
  roles:
    extend:
      palette_role: accent                  # base | accent | highlight
      follow_screen: true                   # the colours of the screen it hangs above (that screen's art, with "art")
      chroma_max: chroma_max                # the vibe's chroma_max
      motion: true
      dynamics: 1.0                         # above a screen: co-moves with the picture
    key:
      palette_role: base
      white_k: key_cct                      # the vibe's key_cct: white first...
      chroma_max: lamp_chroma_max           # ...tinted at most this much (about 0.05 is a faint tint)
      avoid_hues: [[140, 230]]              # starting point (§8.8): OKLCh hue degrees, never green or cyan on a key
      motion: false
      dynamics: 0.6                         # opposite: the slower partner

director:
  steps:
    size_from: step_size                    # one Calmer/Wilder step: the vibe's step_size, within its energy range
    max_from: max_steps
  keep_s: 900                               # starting point (§8.4): Keep this look, 15 minutes
  low: {level: 0.10, fade_s: 2.0}           # starting point (§8.4): Lights low
  house: {white_k: 2700, level: 0.8}        # starting point (§8.4): House lights when the room has no stored house
                                            # state for a lamp
  next_max_wait_s: 4.0                      # starting point (§8.4): Next look lands on the next bar, at most this long
  genre_min_conf: 0.4                       # the local ML's genre word counts at this share (genre_map; 17 Oct)
  art:
    poll_s: 60                              # starting point: how often the art palette's stills are read
    colours: 5                              # starting point (§8.8): OKLCh clusters per still
    sources:                                # first that gives colours wins: the UNMASKED art first (the light mask
      - "http://127.0.0.1:5000/output/{id}.jpg"          # is display dimming, not the art's colour: 75, 17 Oct)
      - "/api/v1/screens/{id}/art"                       # room: the art as on the glass
      - "/api/v1/screens/{id}/snapshots/anchor.png"      # room: the still at the last cut
    min_lightness: 0.3                      # starting point: the art qualifies only if its lightest colour (OKLab L)
    min_chroma: 0.03                        # ...and its most colourful (OKLab chroma) clear these; else the next palette
  republish_s: 5                            # starting point: room.direction / room.look again even when nothing changed
  # When looks change (§8.5). Starting points.
  between_pieces: {pause_s: 2.0, damper_up: 0.1}   # a pause: no strike for pause_s, no key down, damper under damper_up
  new_song_after_s: 8.0                     # sound back after this much silence: a new song (the palette moves on)
  novelty: 0.12                             # |fast - slow| energy that counts as a change point when changing by time
  variation_bars: 64                        # while Keep this look holds: a new allocation after this many bars
  entry_fade_s: 8.0                         # entering a vibe: the lamps fade in from the house light (§8.6)
  no_feel:                                  # owner, 17 Oct: the director always resolves a palette. With no feel set
    palettes: [art, ember, gold, dusk]      # it picks from these (the home feel's list; art = the screens' own art); [] = the old neutral
  emphasis_edges: [0.4, 0.75]               # arousal where the screens' emphasis moves base -> accent -> highlight (§8.3)
  # How deep the lamps' beat swell goes for each of the vibe's accent styles (artnet_out's hue_depth: 0 = steady
  # colour, 1 = the full swell). Starting points. With beat_lock false or an unsure clock, there is no beat swell.
  accent_depth: {none: 0.0, soft: 0.3, downbeat: 0.5, beat: 0.7, full: 0.9}
  # How a look change crosses over for each transition_style word (config/live/vocab.yaml): a crossfade over this many
  # beats (or seconds while the clock is unsure), or a cut. A word with no entry crossfades over 3 s. Starting points.
  transitions:
    gentle: {style: crossfade, beats: 4, seconds: 4}
    lively: {style: crossfade, beats: 1, seconds: 1}
    wild:   {style: cut, seconds: 0.05}
  # The listener's trajectory word nudges the energy by this much (times its confidence; §8.2's L2). Starting points.
  listener_bias: {building: 0.05, peak: 0.1, sustaining: 0.0, steady: 0.0, releasing: -0.05, winding_down: -0.1}
  # README S5.22: the listener's approach.change word -> room.direction's change_rate while no feel sets one (the
  # band rows' own values). Its approach.intensity is the band base's genre term, its transitions the
  # transition_style (under a person's or the feel's own). Starting points.
  listener_change: {slow: 0.15, medium: 0.45, fast: 0.75}
  # The L1 music table (§8.2): energy bands and the words they bring. Copied as a starting point from
  # stream_service/music_direction.py BANDS (the renderer's own table today), so screens read the same words.
  bands:
    edges: [0.30, 0.55, 0.75]               # still | groove-or-pulse | lively | peak (peak 0.80 -> 0.75, 2b's replay of
                                            # 8f4a0247: with the absolute base no band p90 topped 0.74)
    hysteresis: 0.04
    dwell_s: 20                             # starting point: a new band's words land once it has held this long (2b,
                                            # 17 Oct: the words flapped up to 4 times a minute on ambient). The bands
                                            # read the music as heard within the feel's range, not the look's energy
    split: {band: 1, by: drive, up: 0.65, down: 0.55}   # band 1 (0.30-0.55): groove below, pulse above
    base:                                   # how energetic the music is, absolutely (2b's replay, 17 Oct: normalised
                                            # loudness alone read mastered house and pop as peak throughout and an
                                            # ambient pad as lively). base = the weighted terms present: the genre
                                            # words' energy, the onset rate / rate_full, the pulse clarity; the band
                                            # energy = base + swing x (the heard energy - its median over the window),
                                            # within the feel's range. Room volume never counts (owner, 17 Oct).
      genre_energy:                         # starting points: a genre's usual energy, 0..1
        ambient: 0.15
        classical: 0.45                     # 2b, 17 Oct: a presto sat on still; a nocturne's low mood_energy keeps it there
        piano: 0.3
        soundtrack: 0.35
        singer-songwriter: 0.3
        folk: 0.35
        downtempo: 0.35
        jazz: 0.4
        country: 0.45
        blues: 0.45
        gospel: 0.5
        soul: 0.5
        rnb: 0.5
        reggae: 0.5
        world: 0.5
        indie: 0.6
        latin: 0.6
        pop: 0.65
        hip-hop: 0.6
        electronic: 0.6
        funk: 0.65
        afrobeat: 0.65
        rock: 0.8                           # 2b, 17 Oct: rock sat on pulse's dreamy words
        disco: 0.7
        house: 0.7
        techno: 0.7
        trance: 0.75
        punk: 0.85
        drum-and-bass: 0.8
        dubstep: 0.8
        metal: 0.9
      rate_full: 12                         # onsets a second that read 1 (measured 17 Oct: techno 10.75, house 7,
                                            # soul 6.5, rock 5.75, pop 5, jazz 4, ambient 1.75, Saltarello 0.5)
      weights: {genre: 0.4, rate: 0.2, clarity: 0.15, moods: 0.25}   # clarity: the pulse clarity; moods: music.context
                                            # mood_energy (hears a presto in legato strings: onsets miss it)
      swing: 0.5                            # a drop lifts a track, a breakdown drops it, by this x the heard change...
      swing_max: 0.2                        # ...at most this far above the base...
      swing_max_down: 0.1                   # ...and this far below (2b: quiet passages dragged a presto to still)
      phase_lift: {drop: 0.2, peak: 0.2}    # structure's phase: the band rises where the song drops (mastered house
                                            # barely moves in normalised loudness)
      swing_window_s: 60
    words:                                  # change_rate (with no feel: room.direction's; a feel's own wins): 0.15 lingers
                                            # (~2 min a scene), 0.75 changes every ~30 s (starting points, 2b's audit)
      still:  {moods: [calm, mellow, elegant, dreamy],    fx_moods: [calm, mellow, elegant, dreamy],    transition_style: gentle, change_rate: 0.15}
      groove: {moods: [mellow, elegant, warm, organic],   fx_moods: [mellow, warm, elegant, liquid],    transition_style: gentle, change_rate: 0.3}
      pulse:  {moods: [dreamy, hypnotic, liquid, organic], fx_moods: [dreamy, hypnotic, liquid, mellow], transition_style: lively, change_rate: 0.45}
      lively: {moods: [bright, playful, geometric, hypnotic], fx_moods: [playful, retro, hypnotic, geometric], transition_style: lively, change_rate: 0.6}
      peak:   {moods: [euphoric, hypnotic, bright, aggressive], fx_moods: [euphoric, hypnotic, glitchy, bright], transition_style: wild, change_rate: 0.75}
  # Stage 4 (§8.5, with structure.py's sections, builds and drops). Lamps and DMX only: screens get looks, words and
  # events, never a dip, a hit or a floor. Starting points, all of them.
  sections:
    max_late_bars: 1                        # §8.5: a section change landing later than this into its section makes no
                                            # new look...
    express_gain: 0.5                       # ...the section shows inside the look instead: level, accent density and
                                            # spread move by this x the energy step from the last section
    phase_hint_s: 1.5                       # an event's phase (build, drop, breakdown) holds this long, until
                                            # music.context (1 Hz) has caught up
  peaks:
    after_build_s: 30                       # only a drop this soon after a build spends a peak token (the vibe's
                                            # peak_tokens_per_hour, at most that many in any 60 minutes; unset = 0)
  build:                                    # §8.5 build -> drop
    step_bars: 4                            # the accent subdivision steps 1/2 -> 1/4 -> 1/8 every 4 bars...
    step_bars_late: 2                       # ...every 2 once build_progress reaches 0.5 (§8.5: every 2-4 bars)
    narrow: 0.6                             # lamps converge on the accent (tension) colour by build_progress x this
    dip_level: 0.25                         # pre-drop: lamps dip to this (§8.5: 20-30 %)...
    dip_bars: 1                             # ...for the last bar before the drop line
    hit_beats: 1                            # §8.5: the drop is a unison hit on lamps and DMX, one beat long
    hit_swell_ms: 300                       # §5.4: a drop nobody predicted reaches an output that takes no hits (Hue)
                                            # as a swell this slow (up, then down after the hit); a predicted drop
                                            # line's hit lands on time everywhere. 300..10000 (README S5.14)
  breakdown: {floor_add: 0.1, motion_scale: 0.5, saturation_scale: 0.8}   # §8.5: floor up, motion slower, -20 % saturation
  screens:                                  # the screens' palette (agreed with 2f and 04, 16 Oct): while a vibe plays,
    send_palette: true                      # live screens get the director's catalog palette (PATCH /screens/{id}/look,
                                            # once per change); false: the director never touches it (hot-reloaded)
    palette_transition_s: 4                 # starting point (the renderer's own default, LIVE_V1 §1.11)
    # Stage 5 (README S5.8, agreed with 2f, 16 Oct): a palette a person picks on a screen holds the screens' palette
    # (the director stops sending) until the next mode change, Back to auto, or the chip's x.
    hold_hand_picks: true                   # false: the director sends over a hand pick, as in Stage 4 (hot-reloaded)
    own_echo_s: 3                           # agreed with 2f: a screen.look without a source whose palette is what we
                                            # sent that screen this recently is our own change coming back
  # Song ends (README S5.17, owner 17 Oct): how the screens cross a song change. The director picks one for every
  # track_end_armed, track_end and track_change, and it goes on that room.event ("transition") for the renderer.
  # While a person holds the look (Keep this look, their change pending) the event says held instead. Starting
  # points, all of them.
  track_transitions:
    gap:                                    # a gap between the songs (or one coming: the room silent, or the song in
                                            # its outro, as it ends): through dark
      out_s: 2.5                            # the old song's scene fades to dark over this...
      in_s: 2.0                             # ...and the new one fades in over this
      min_s: 1.5                            # each half stays within min_s..max_s (after the feel's scale)
      max_s: 4.0
      dark_max_s: 8                         # the screens (and the lamps' dip) never stay dark longer than this
    segue:                                  # no gap: the new song starts as the old one ends
      cut_gate: beat                        # the clock at this gate (dmx|beat) or better: a cut on the new song's
                                            # first downbeat...
      crossfade_s: 2.0                      # ...else a crossfade over this
    styles:                                 # the feel's transition_style (config/live/vocab.yaml) biases it. cut:
      gentle:  {cut: never, scale: 1.5}     # never (a crossfade instead), beat (only on the beat), always (on the
      lively:  {cut: beat, scale: 1.0}      # downbeat when the clock allows, else now). scale: every length times this
      wild:    {cut: always, scale: 0.6}
      default: {cut: beat, scale: 1.0}      # no feel set (the screens follow songs without one too), or a word with
                                            # no entry here
    change:                                 # big: a new scene family and palette; small: the same family and palette.
      genre: true                           # the genre words differ (genre_map.parents)...
      key_fifths: 2                         # ...the keys this many steps apart on the circle of fifths (the same,
                                            # parallel or relative key: 0)...
      tempo_ratio: 0.08                     # ...the tempos apart by more than this (x2 and x0.5: the same tempo)...
      energy: 0.25                          # ...the songs' mean energy this far apart...
      artist: true                          # ...Sonos's artist differs. Each known on both sides votes (null: off);
      big_share: 0.5                        # big when at least this share of the votes differ,
      unknown: big                          # and this when none is known yet (a Sonos change, at once)
  # Composition and balance (README S5.18; SHOW_ENGINE §8.10; owner 17 Oct: one composer, many renderers; volume is
  # never intensity). How much each enabled appliance (a live screen, a lamp following the show) answers the music's
  # loudness, per dimension (picture, level, pace, pulse, depth, change), as a share of today's value. A feel's
  # compose block (vibes.yaml) sets its limits; these are the grammar. Starting points, all of them, to tune by ear.
  compose:
    mode: observe                           # observe: the plan goes out on room.look (compose) and nothing else changes;
                                            # drive: room.direction's intensity, pulse_depth and peak, the tempo fold
                                            # and the lamps' beat ladder and no-beat swell take it (hot-reloaded)
    loud: {rise_s: 0.7, fall_s: 1.5, fade_fall_s: 0.35, music_only: true}   # the loudness (features.gate) rises fast,
                                            # falls slowly, faster on a fade (an outro, an armed song end); talk is
                                            # never loud; the piano's velocity replaces it while it plays
    range: {window_s: 60, lu: [3, 12], min_gate: 0.05}   # the song's own range: p90 - p10 of lufs_s over 60 s of
                                            # music; 3 LU (compressed, AGC'd: nothing pumps) .. 12 LU (the whole share)
    response_file: config/live/music_response.json      # 75's tempo.fold_min / fold_max: the ONE tempo fold
    headroom: {apl: [0.12, 0.45], unknown: 0.5, dims: [picture]}   # a dark scene isn't dimmed further (the scene's
                                            # APL from the renderer, step 3; unknown until then)
    lift: {picture: {tension: 0.3, build: 0.3}}         # a quiet but tense build keeps the picture up
    weights: {screens: 1.0, lamps: 1.0}     # W by class; a lamp role's own dynamics (lamps.roles above) wins
    hard_floor: {screens: {picture: 0.6}}   # the picture never goes below this, whatever a feel asks
    smooth: {tau_s: 1.0, deadband: 0.02}    # range and lift ease over tau_s; drive sends the lamps' plan on 0.02 moves
    defaults:                               # no feel, or a feel without a compose block: a modest follow
      follow: 0.4
      q:                                    # the quiet end, as a share of today's value (1 = never changes)
        screens: {picture: 0.9, pace: 0.7, pulse: 0.7, depth: 0.7, change: 0.7}
        lamps: {level: 0.6, pulse: 0.7}

listener:                                   # §7.3, §7.5. Starting points, all of them.
  # README S5.22 (owner, 18 Oct: "24 s every 20 s is too long a round trip"): a 10 s clip every 15 s while the music
  # is steady; every 5 s while something develops (structure's build or outro, a forecast window open or opening
  # within fast_lookahead_s, an armed song end within fast_end_s, a section boundary in the last
  # fast_after_section_s); up to max_in_flight calls at once, starts at least min_gap_s apart
  cadence_s: 15
  fast_cadence_s: 5
  clip_s: 10                                # the last 10 s (16 kHz mono from the ring)
  min_gap_s: 4
  max_in_flight: 2
  fast_lookahead_s: 20
  fast_end_s: 30
  fast_after_section_s: 10
  est_fast_share: 0.5                       # the cost estimate's share of time at the fast cadence until an hour of
                                            # listening has measured it (forecasts open fast windows often)
  quiet_gate: 0.1                           # the loudness gate's mean over the last 10 s must reach this
  requires_auto: true                       # owner, 17 Oct: no audio goes to any provider unless Auto is on (cost, and
  requires_mic: true                        # it's intrusive) and the room's mic is on; re-checked right before each
                                            # upload. The mode's show.main "listening" no longer gates (17 Oct)
  requires_mode: true                       # owner, 20 Oct: "the default should be that it doesn't send except on a
                                            # live mode ... it's intrusive and expensive to have it running by default
                                            # if e.g. people are just in the room talking normally". A mode lets it
                                            # listen only through its own row (room_service's show.ai, like show.mic);
                                            # never set = off. The Room page's AI listening switch stays the master
  evening_h: 4                              # README S5.20: the evening the Music card's estimate covers (starting
                                            # point): est_evening_usd = evening_h x the calls an hour (the blend of
                                            # cadence_s and fast_cadence_s by est_fast_share) x the cost a clip
  min_clip_s: 6                             # the ring records only while a clip could go: a first clip waits this
                                            # long; a room clip needs at least this much music without talking
  music_gate: classifier                    # room-mic clips go only while a music/speech classifier says music, with
                                            # speech under 0.3. The classifier is CED, in P1. "dsp" would allow a DSP
                                            # guess instead (a steady beat over the loudness gate): that is the owner's
                                            # choice. A sender with room_sound: false skips this check, nothing else.
  describe_timeout_s: 8                     # then the local keyword match answers (§7.4)
  ced:                                      # Stage 4 (§7.5): with music_gate classifier, a room-sound clip is the
    music_min: 0.4                          # longest run of seconds CED calls music (at least this; 20 Oct, 8f: 0.5
                                            # opened on 44-100% of ticks over the 9 test tracks at room level, 0.4 on
                                            # 68-100%; room noise peaks at 0.09)...
    speech_max: 0.3                         # ...with speech under this (§7.5)...
    speech_words: [speech, conversation, crowd]   # ...speech being the max of these CED words (starting point: guests
                                            # talking over music show as conversation and babble, not only Speech)
    speaks_s: 1.0                           # README S4.8: each CED reading vouches for the last second of its window
  section_call_after_s: 8                   # Stage 4 (§7.3): one extra call this long after a section boundary

# The cue engine (cues.py; README S5.22, owner 18 Oct): the listener arms, a real-time component fires. Standing cues
# (an abrupt stop, a fade-out) run while music plays, the listener's `ending` picking which; forecast cues come from
# its `coming`. Starting points, all of them.
cues:
  stop:                                     # an abrupt stop -> track_end "stop" (fade-dark), "sound_back" if it returns
    collapse_db: 20                         # the fast level (20 ms rms) falls this far under the 2 s median before...
    fall_s: 0.3                             # ...within this long...
    ref_s: 2
    loud_db: 6                              # (a "loud" tick: within this of the median)
    quiet_ticks: 2                          # ...stays down this many 10 Hz ticks...
    floor_margin_db: 12                     # ...and ends within this of the stream's floor (the median level of its
    floor_gate: 0.05                        # recent quiet seconds: the loudness gate under floor_gate throughout)
    quiet_dbfs: -45                         # (before the floor is known: under this)
    back_db: 15                             # sound back: within this of the median before the stop, for back_ticks
    back_ticks: 2
    watch_s: 15                             # watched this long (structure's own track_end takes over before that)
    out_s: 0.2
    in_s: 1.0
    dark_max_s: 8
  fade:                                     # structure's outro phase -> track_end "fade" (fade-dark)
    slope_s: 4                              # out_s = the time to the floor at lufs_s's slope over this long...
    min_s: 3                                # ...clamped to min_s..max_s
    max_s: 12
    floor_above_db: 6                       # "the floor" = the stream's floor + this (none yet: floor_lufs)
    floor_lufs: -50
    back_db: 3                              # sound back: lufs_s this far over where it was when the fade began...
    back_s: 1                               # ...for this long
    in_s: 2.0
    dark_max_s: 8
    watch_s: 30
  forecast:                                 # the listener's coming -> drop (big) / section_change (medium) events
    min_conf: 0.6                           # at this confidence, with an early sign, a phrase line in the window...
    phrase16_conf: 0.5                      # (16 bars at the clock's phrase_conf, else 8)
    grid_conf: 0.5                          # (the clock's bar_conf for its bar lines)
    lead_bars: 1                            # ...is fired AT the line, published this far ahead (>= min_lead_s)
    min_lead_s: 1.1                         # else the next downbeat at least this far ahead once a sign is seen
    slack_s: 2                              # the window's ends, widened by this
    rise_db_s: 0.15                         # an early sign: lufs_s rising this fast over rise_s
    rise_s: 6
  signs:
    louder_db: 4                            # lufs_m: the last 0.3 s over the 2 s before
    low_in_db: 6                            # music.rhythm low_db: the same
    busier_rate: 0.75                       # onset_rate up this much (per s) on 3-4 s before...
    busier_ratio: 1.3                       # ...and by this factor
    perc_jump: 0.15                         # percussive_ratio up (drums_in) or down (drums_out) by this
    voice_on: 0.6                           # the ML worker's voice_p crossing up through this (vocal_in)...
    voice_off: 0.4                          # ...or down through this (vocal_out)...
    voice_window_s: 6                       # ...within this long
    stop_return_db: 15                      # a dip this deep...
    stop_return_min_s: 0.15                 # ...this long at least...
    stop_return_max_s: 3                    # ...and at most, then back
    key_min_strength: 0.3                   # music.context's key at this strength, other than at arm time
    seen_s: 4                               # a sign counts this long after it is seen

# ---- Stage 4 (README "Stage 4") ------------------------------------------------------------------------------------
# The local ML worker (§6): a child of show_service in its own venv, fed the measured stream at 16 kHz over a pipe,
# answering one JSON line per result (README S4.3). Without it (disabled, missing, failing) every reader degrades to
# its Stage-3 behaviour (S4.3 "Without the worker"). Read by mllink, which hands this whole section to the worker.
ml:
  enabled: true                             # false: no worker (the rollback; hot-reloaded)
  python: ~/.venvs/sm-show-ml/bin/python    # the worker's own venv, never show_service's
  models_dir: ~/.cache/screen-machine/models   # tools/show/fetch_models.py fills it (never git)
  nice: 19                                  # owner: the host renders 4K
  cpu_max: 0.35                             # starting point: the worker's share of one core; owner: show_service and
                                            # the worker together stay under 0.8 of a core (the worker has two compute
                                            # threads, its fast lane and its beats lane: owner, at most 2)...
  cpu_floor: 0.1                            # ...so while the two of them are over 0.8 for 60 s, the worker's cpu_max
                                            # becomes 0.8 less show_service's share, never under this (starting point)
  silence_dbfs: -70                         # starting point: a quieter window runs no model (CED reports silence)
  results_stale_s: 3                        # starting point: a CED/tags result older than this is not "now"...
  stale_periods: 1.5                        # ...nor older than this many of its task's intervals now (starting point;
                                            # the worker stretches them under load, and every reader follows)
  fast_lane:
    every_s: 1                              # §6: CED and EffNet every second
    budget_ms: 250                          # starting point: one cycle's hard budget; a task that won't fit is skipped,
                                            # never queued
  tasks:                                    # §6's table: window_s is the audio a run sees, budget_ms its hard cap
    ced:
      every_s: 1
      window_s: 2.0                         # §6: 22 ms per 2 s (measured, 15 Oct)
      model: ced-mini                       # fetch_models.py catalogue names
      budget_ms: 100                        # starting point
    tags:
      every_s: 1
      window_s: 2.1                         # one EffNet patch: 128 frames x 256 samples at 16 kHz
      model: discogs-effnet
      budget_ms: 80                         # starting point (§6: 6-9 ms + under 1 ms a head, measured)
      styles_top: 5                         # the styles a tags line carries for genre_map (measured 17 Oct)
      heads:                                # music.context field -> catalogue head (index.json says which class is "yes")
        genre: genre_discogs400             # also gives genre_parents and styles_top3
        moods: mtg_jamendo_moodtheme
        instruments: mtg_jamendo_instrument
        dance: danceability
        voice_p: voice_instrumental
        engagement: engagement_regression   # reads null: Essentia doesn't publish its output range (index.json
                                            # facts.range unset; measured -0.01..1.01 on the test tracks, B7 16 Oct)
        bright: timbre                      # Essentia's bright/dark head, trained on music (nsynth_bright_dark has no
                                            # ONNX and was trained on single notes; B7 16 Oct)
        acoustic: mood_acoustic
        # arousal: deam                     # off (measured 16 Oct, B7): MSD-MusiCNN costs 45-55 ms a run, 8x EffNet,
                                            # +0.05 core and tags' p95 near its 80 ms budget; arousal reads null
    key:
      every_s: 2
      window_s: 20                          # §6: Essentia HPCP + Key over 20 s, every 2 s
      profile: bgate                        # Essentia Key's own default profile
      budget_ms: 60                         # starting point
    beats:
      every_s: 10                           # §5.3, §6: every 5-10 s
      window_s: 30                          # §5.3: the interior of a 30 s window
      interior_margin_s: 3                  # starting point: the window's edges are left out
      model: beat-this-small0               # measured 15 Oct: 0.75-0.8 s per 20 s on 2 cores
      budget_ms: 5500                       # starting point: about 2x its p95 under the 4K render (2.3-2.8 s, 16 Oct);
                                            # an overrun skips the task's next turn
  ced_groups:                               # CED's AudioSet classes -> the seven words; a word is the max of its classes
    music: [Music, Singing, Choir, A capella]   # (design choices, starting points; a class the model lacks is logged)
                                            # singing counts as music (owner's 20 Oct test: someone singing)
    speech: [Speech, "Male speech, man speaking", "Female speech, woman speaking", "Child speech, kid speaking",
             "Narration, monologue"]
    conversation: [Conversation]
    singing: [Singing, Choir]
    crowd: [Crowd, Chatter, "Hubbub, speech noise, speech babble"]
    applause: [Applause, Clapping, Cheering]
    silence: [Silence]
  beat_votes:                               # §5.3: Beat This! gives integer corrections only (the one, the bar length,
    match_ms: 70                            # the octave). A beat this close to a clock beat agrees (starting point)
    octave_tol: 0.06                        # tempo ratios within 6 % of 1/2, 1 or 2 (starting point)
    min_conf: 0.6                           # starting point: the share of the local span's beats that must agree
    local_s: 10                             # starting point: agreement is read over the window's last 10 s (where the
                                            # clock's line holds; README S4.5 "Beat votes")
    one_agree: 0.6                          # starting point: the share of downbeats that must fall on one beat of the bar
    agree_runs: 2                           # starting point: the same vote this many runs in a row before it applies
    bar_agree_runs: 4                       # starting point: a new bar length (the meter) needs this many, each with a
                                            # one (§5.3: stronger evidence for what moves every bar line)
    bar_lens: [3, 4]                        # starting point: the bar lengths it may set
    cooldown_s: 30                          # starting point
    # An octave goes to the clock with these; it judges it on the room's audio at its switch beat (conf can't pick an
    # octave: one grid's beats are a subset of the other's). Measured 21 Oct on 26's replays (README S4.15 "Octave
    # evidence"; the activation at the beats an octave adds or drops over the beats both keep, above its median):
    octave_add_min: 0.2                     # measured: a x2 needs the beats midway at this share or more (the right
                                            # x2s read 0.41-1.24; nothing there ~0.03)
    octave_drop_max: 0.5                    # starting point: a x0.5 whose dropped beats are this weak applies on the
                                            # audio (none measured: the right halvings read 0.59-1.88, the wrong 0.78-1.45)
    octave_prior_oct: 0.8                   # measured: otherwise the halved tempo within 0.8 octave of 120 bpm (>= 69;
                                            # the pop's wrong halvings 62.5-65, the right ones 73-91)
  restart:
    backoff_s: [2, 5, 15, 60, 300]          # starting point: the wait after each failure in a row; then 300 s for ever
                                            # (each at least 1 s)
    healthy_s: 600                          # starting point: running this long resets the backoff
    stall_s: 30                             # starting point: no line from the worker this long while fed: restart it

