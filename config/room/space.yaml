# config/room/space.yaml: the room in metres (docs/LIGHTS.md §3). x east, y north, z up; origin the south-west floor
# corner. Hand-written; the Lights page's Room map writes config/room/space.added.yaml (merged under this file: this
# file wins on a clash). show_service re-reads both when they change. Nothing here is measured yet: set the room on the
# Room map (or here), never guess. Anything set here can't be moved on the page (it shows as fixed), so leave a thing
# commented while it is placed on the map.
#
# The drawing room as known: the two Frame TVs hang side by side on the SAME wall, the west wall, both FACING EAST
# (owner, 22 Oct: "they're not on opposite walls ... they are on the same side, facing east"): the south screen at the
# south end, on the left as you face them, and the north screen at the north end, on the right. The four Hue lamps
# (owner, 14 Oct; config/room/patch.yaml and fixtures.yaml): "SE is above the south screen and SW opposite it; NE is
# above the north screen and NW opposite it"; the Steinway and the
# glitterball (room device mirror_ball: its motor turns with the flow, docs/LIGHTS.md §4.4) are in the room. Every
# measurement below is a commented starting point in <angle brackets>: measure it, or place it on the Room map.
# Ids are fixtures.yaml's (screen.north, hue.ne, ...) and the Lights page's lights (dmx.*).
version: 1
room:
  # size: [<east-west m>, <north-south m>, <floor to ceiling m>]   # measure
  front: west                      # the wall people face: the screens' wall (owner, 22 Oct), so the south screen is on
                                   # the left and the north screen on the right
appliances: {}                     # fixture id or room device -> where it is (the page writes these; the room's own:)
  # Both screens: on the west wall (x = 0), facing east (normal [1, 0, 0]); north screen at the larger y.
  # screen.north: {at: [0, <y: the picture's centre along the wall>, <z: centre height>],
  #               plane: {normal: [1, 0, 0], up: [0, 0, 1], size: [<picture width m>, <height m>]}}
  # screen.south: {at: [0, <y: south of the north screen>, <z>], plane: {normal: [1, 0, 0], up: [0, 0, 1],
  #               size: [<width m>, <height m>]}}
  # hue.ne: {at: [<x>, <y>, <z>]}                  # by the NE corner, above the north screen
  # hue.nw: {at: [<x>, <y>, <z>]}                  # by the NW corner, opposite the north screen
  # hue.se: {at: [<x>, <y>, <z>]}                  # by the SE corner, above the south screen
  # hue.sw: {at: [<x>, <y>, <z>]}                  # by the SW corner, opposite the south screen
  # dmx.mover-1: {at: [<x>, <y>, <z>], mount: ceiling}            # ceiling | floor | wall | truss (the solve's hint)
points: {}                         # named places lights can aim at (the page writes these too; the room's own:)
  # piano: {label: The piano, at: [<x>, <y>, <z: the lid>]}
  # mirror-ball: {label: Mirror ball, at: [<x>, <y>, <z>], device: mirror_ball}
regions: {}                        # named areas on a surface, e.g. a dance floor (centre + size on that surface)
  # dance-floor: {label: Dance floor, surface: floor, centre: [<x>, <y>, 0], size: [<w>, <d>]}
surfaces: {}                       # extra planes beyond floor, ceiling and the four walls
  # tv-wall: {label: TV wall, origin: [...], normal: [...], up: [...], size: [<w>, <h>]}
