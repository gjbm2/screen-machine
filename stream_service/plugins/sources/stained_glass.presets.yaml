stained_glass-cathedral:
  label: Cathedral window (leaded glass, moving sunlight)
  source: stained_glass
  params:
    cell_density: 9.0
    interior: 0.9
    jitter: 0.85
    bevel: 0.55
    backlight: 0.85
    glow: 0.15
    palette: rainbow
    palette_period: 1.0
    drift_speed: 0.02
  bindings:
    energy: {bind: energy}
    pulse: {kick: beat, amount: 1.0}
  tags:
    energy: [0.1, 0.5]
    moods: [elegant, bright, warm]
    style: gentle
    family: light
    dims: 2d
    technique: [cellular, analytic, light]
    weight: 1.0

stained_glass-cooling-lava:
