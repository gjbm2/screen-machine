live-score-v2-page-paper:
  label: "Live score v2: page (paper)"
  source: score_v2
  params:
    layout: page
    look: paper
    lines: 4
    palette: ember
    note_glow: 0.8
  bindings:
    pulse: {kick: note_on, amount: 0.5}
  tags:
    energy: [0.0, 0.8]
    moods: [elegant, calm, warm]
    modes: [piano]
    family: score
    dims: 2d
    weight: 1.0

