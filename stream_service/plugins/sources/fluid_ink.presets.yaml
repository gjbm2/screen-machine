fluid-ink-silk:
  label: Silk ink
  source: fluid_ink
  params:
    palette: ocean
    palette_period: 0.8
    drift_speed: 0.03
    vorticity: 6.0
    trail_length: 0.8
    splat_radius: 0.5
    emitter_symmetry: 2.0
    emitter_orbit: 0.35
    shading: 0.35
    bloom: 0.9
    emitter_spin: 0.05
    splat_kick: 0.6
    surge_kick: 1.0
  bindings:
    energy: {bind: energy}
    pulse: {kick: beat, amount: 1.0}
  tags:
    energy: [0.15, 0.6]
    moods: [liquid, dreamy, calm, elegant]
    style: gentle
    family: water
    dims: 2d
    technique: [simulation, field]
    weight: 1.0

fluid-ink-neon-swirl:
