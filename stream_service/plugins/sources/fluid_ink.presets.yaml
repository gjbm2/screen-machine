fluid-ink-paint-splash:
  label: Paint splash
  source: fluid_ink
  params:
    palette: rainbow
    palette_period: 1.0
    drift_speed: 0.06
    vorticity: 14.0
    trail_length: 0.35
    splat_radius: 0.4
