lichtenberg-blue-lightning:
  label: Blue lightning (from the sky and the ground)
  source: lichtenberg
  params:
    style: 0.05
    seed_layout: line
    branchiness: 0.9
    anisotropy: 0.0
    palette: ice
    palette_period: 0.8
    regrow_cycle_length: 15.5
  bindings:
    energy: {bind: energy}
    pulse: {kick: beat, amount: 1.0}
  tags:
    energy: [0.45, 1.0]
    moods: [tense, icy, aggressive]
    style: lively
    family: light
    dims: 2d
    technique: [simulation, fractal]
    weight: 1.0

