    window_s: 30
    labels: 0.4
    satellites: 0.3
    ghost: 0.7
  bindings:
    energy: {bind: energy}
    pulse: {kick: note_on, amount: 0.3}
  tags:
    energy: [0.0, 0.6]
    moods: [elegant, calm, mellow]
    modes: [piano]
    style: gentle
    family: geometric
    dims: 2d
    technique: [sdf, analytic]
