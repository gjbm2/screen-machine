hue-drift-rainbow-tones:
  label: Rainbow tones (slow hue drift fanned across shadows to highlights)
  effect: hue_drift
  params: {amount: 0.85, rate: 0.04, luma_spread: 0.85, channel_cycle: 0.0, saturation: 1.2, vibrance: 0.4,
           tint_strength: 0.15, punch: 0.5, sat_punch: 0.3, palette: rainbow, drift_speed: 0.02}
  bindings:
    pulse: {kick: beat, amount: 1.0}
  tags:
    energy: [0.0, 0.7]
    moods: [dreamy, playful, euphoric]
    style: gentle
    family: colour
    dims: 2d
    technique: [colour]
    weight: 1.0

