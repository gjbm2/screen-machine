  params: {amount: 1.0, pitch: 30, emitter_shape: 0.0, emitter_size: 0.86, subpixel: 1.0, gap_darkness: 0.95,
           glow: 0.7, module_size: 8, colour_bits: 4, variation: 0.85, tint: 0.0, beat_kick: 1.5, refresh_band: 0.5}
  bindings:
    pulse: {kick: beat, amount: 1.0}
  tags:
    energy: [0.4, 1.0]
    moods: [retro, bright, euphoric]
    style: lively
    family: stylise
    dims: 2d
    technique: [tiling, light]
