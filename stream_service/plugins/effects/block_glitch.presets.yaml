  params: {amount: 0.75}
  bindings:
    pulse: {kick: beat, amount: 1.0}
  tags:
    energy: [0.5, 1.0]
    moods: [glitchy, aggressive, tense]
    style: wild
    family: glitch
    dims: 2d
    technique: [glitch, tiling]
    weight: 1.0

