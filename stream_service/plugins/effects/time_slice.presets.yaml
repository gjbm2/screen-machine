time-slice-rubber-rings:
  label: Rubber time rings (centre now, edges in the past)
  effect: time_slice
  params: {amount: 0.8, delay_map: 0.66, map_scale: 1.2, channel_offset: 0.3, flow: 0.05, tint_mix: 0.2}
  bindings:
    pulse: {kick: beat, amount: 1.0}
  tags:
    energy: [0.2, 0.65]
    moods: [dreamy, hypnotic, liquid]
    style: gentle
    family: stylise
    dims: 2d
    technique: [feedback, warp]
    weight: 1.0

time-slice-rgb-glitch:
  label: RGB time glitch (noise map, wide channel lag)
  effect: time_slice
  params: {amount: 0.9, delay_map: 1.0, map_scale: 1.6, channel_offset: 0.85, depth_curve: 0.7, flow: 0.12,
           depth_kick: 1.0, spread_kick: 2.0, tint_mix: 0.1, palette: neon}
  bindings:
    pulse: {kick: beat, amount: 1.0}
  tags:
    energy: [0.45, 0.8]
    moods: [glitchy, hypnotic, playful]
    style: lively
    family: stylise
    dims: 2d
    technique: [feedback, glitch, noise]
    weight: 0.9
