strobe_flash-drop-white:
  label: Drop strobe (white-hot flash, slight RGB tear)
  effect: strobe_flash
  params: {amount: 0.8, mode: 0.12, flash_ceiling: 0.5, envelope_shape: 1.8, channel_stagger: 0.25, spatial: 0.2,
           base_mix: 0.05, palette: neon}
  bindings:
    pulse: {kick: beat, amount: 1.0}
  tags:
    energy: [0.8, 1.0]
    moods: [aggressive, euphoric, bright]
    style: wild
    family: stylise
    dims: 2d
    technique: [light, colour]
    weight: 1.0

strobe_flash-solar-glitch:
