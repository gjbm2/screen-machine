note-highway-3d-piano-roll:
  label: Piano roll on the floor (notes glide away into the distance)
  effect: note_highway_3d
  params: {amount: 0.8, opacity: 0.85, tilt: 22.0, height: 0.5, curve: 0.0, depth: 1.8, lane_glow: 0.8,
           travel: 0.2, glow: 0.6, bar_lines: 0.5, glass: 0.18, sway: 0.6, palette: rainbow, palette_period: 0.8,
           drift_speed: 0.02}
