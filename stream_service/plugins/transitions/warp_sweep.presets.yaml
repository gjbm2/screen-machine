  transition: warp_sweep
  params: {direction_deg: 225.0, edge_softness: 0.12, zoom_amount: 0.7, camera_mix: 0.0, front_curvature: 0.25}
  tags:
    energy: [0.3, 0.75]
    moods: [playful, bright, elegant]
