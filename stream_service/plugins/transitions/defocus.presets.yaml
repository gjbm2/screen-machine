defocus-rack-focus:
  label: Rack focus
  transition: defocus
  params: {blur_size: 0.02, bokeh_bloom: 0.5, disk_rotation: 0.7, crossfade_window: 0.3, focus_breath: 0.35}
  tags:
    energy: [0.0, 0.4]
    moods: [calm, elegant, dreamy]
    style: gentle
    family: blend
    dims: 2d
    technique: [optical, light]
    weight: 1.0

defocus-dream-bokeh:
  label: Dream bokeh
  transition: defocus
  params: {blur_size: 0.04, bokeh_bloom: 0.9, disk_rotation: 0.85, crossfade_window: 0.55, iris_shape: 0.8,
           focus_breath: 0.6, fringe: 0.5}
  tags:
    energy: [0.05, 0.4]
    moods: [dreamy, mellow, warm]
    style: gentle
    family: light
    dims: 2d
    technique: [optical, light]
    weight: 0.9
