tile_flip_3d-wave:
  label: Diagonal tile wave
  transition: tile_flip_3d
  params: {tile_count: 8, stagger: 0.5, stagger_spread: 0.65, divider_width: 0.04, perspective: 0.6,
           thickness: 0.06, snap: 0.4, palette: neon, backing: 0.3}
  tags:
    energy: [0.4, 0.85]
    moods: [geometric, playful, bright]
    style: lively
    family: 3d
    dims: 2d
    technique: [tiling, projection, analytic]
