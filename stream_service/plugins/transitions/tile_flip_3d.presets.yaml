  params: {tile_count: 14, stagger: 1.0, stagger_spread: 0.8, divider_width: 0.07, flip_axis_deg: 35.0,
           perspective: 0.85, thickness: 0.1, snap: 0.75, palette: dusk, backing: 0.6}
