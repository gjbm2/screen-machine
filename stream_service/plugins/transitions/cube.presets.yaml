cube-classic:
  label: Classic cube
  transition: cube
  params: {perspective: 0.55, unzoom: 0.35, reflection: 0.45, floating: 3.0, palette: neon, floor_tint: 0.6}
  tags:
    energy: [0.4, 0.9]
    moods: [geometric, bright, playful]
    style: lively
    family: 3d
    dims: 2d
    technique: [projection, analytic]
    weight: 1.0

cube-showroom:
  label: Showroom tumble
  transition: cube
  params: {perspective: 0.8, unzoom: 0.6, reflection: 0.65, floating: 5.0, shading: 0.65, floor_light: 0.85,
           palette: dusk, floor_tint: 0.15, reverse: true}
  tags:
    energy: [0.5, 0.9]
    moods: [geometric, bright, elegant]
    style: lively
    family: 3d
    dims: 2d
    technique: [projection, light]
    weight: 0.9
