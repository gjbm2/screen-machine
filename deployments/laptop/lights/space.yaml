# deployments/laptop/lights/space.yaml: the laptop rig's room, in metres (docs/LIGHTS.md §3: x east, y north, z up; the
# origin is the south-west floor corner). Hand-written; the Lights page's Room map writes space.added.yaml beside it
# (merged under this file: this file wins, and what is set here shows as fixed on the map).
#
# PROVISIONAL (owner, 26 Nov: "a sensible neutral configuration for now ... NE and SE, 10M apart ... ceiling height is
# 4M"): a room 5 m east-west by 10 m north-south with a 4 m ceiling; the two GigBARs on their tripods in the east
# corners, bar A NE and bar B SE (A on the left as the room faces them), their bars at 2.5 m, 0.4 m in from each wall,
# each turned to face the room's centre (bars, in space.added.yaml: move them on the Lights page's 3D tab). The
# moving heads stand upright on the bar, facing its front, until "Point it at…" teaches each its real pose from three
# places (docs/LIGHTS.md §3.6). Measure the real room and bars on the day.
version: 1
room:
  size: [5.0, 10.0, 4.0]
  front: east                       # the wall people face: the bars' wall
  haze_half_life_s: 150             # provisional: haze the room, stop the hazer, and time how long it takes to halve
                                    # (show_service/atmosphere.py holds the haze from this and the room's size)

# The two GigBARs are bars (below "appliances"): each is one thing with a place, a height and a facing, set on the
# Lights page's 3D tab (space.added.yaml), and its parts sit where the layout says along it. So there is no line per
# part here any more: a part given its own `at` under appliances keeps that place instead.
appliances:
  hazer: {at: [4.7, 1.2, 0.2]}         # on the floor by bar B
  house-1: {at: [1.25, 2.5, 3.95]}     # the ceiling downlights: a 2 x 2 grid
  house-2: {at: [3.75, 2.5, 3.95]}
  house-3: {at: [1.25, 7.5, 3.95]}
  house-4: {at: [3.75, 7.5, 3.95]}
  screen.vj:                          # the projected picture: ~2 m wide on the east wall between the bars, facing west
    at: [5.0, 5.0, 2.0]               # (16:9 and its centre 2 m up assumed)
    plane: {normal: [-1.0, 0.0, 0.0], up: [0.0, 0.0, 1.0], size: [2.0, 1.125]}
# What a GigBAR MOVE + ILS is, along its bar (docs/GIGBAR_RIG.md §1.1: par 1, spot 1, derby 1, the strobes and the
# laser, derby 2, spot 2, par 2, left to right as you face it). along: metres from the bar's middle (+ to the right
# as you face it); up: metres above the bar; head: a moving head standing on the bar. lean_deg / turn_deg: how the
# part points until its own tilt and turn are set on the Lights page (lean: degrees forward from straight up, 90 is
# level; turn: to the right of the bar's front). PROVISIONAL: the offsets are read off pictures of the unit, and the
# pars' and derbies' angles are how they sit in the maker's pictures: measure the real bars and set them on the page.
layouts:
  gigbar-move:
    parts:
      par1:   {along: -0.5,  lean_deg: 68, turn_deg: -27}
      spot1:  {along: -0.33, up: 0.18, head: true}
      derby1: {along: -0.16, lean_deg: 61}
      strobe: {along: 0.0}                 # the four strobe zones are in the bar's face: they point where it does
      laser:  {along: 0.0}                 # its tilt: the 45-degree rule until set (docs/GIGBAR_RIG.md §3)
      derby2: {along: 0.16,  lean_deg: 61}
      spot2:  {along: 0.33,  up: 0.18, head: true}
      par2:   {along: 0.5,   lean_deg: 68, turn_deg: 27}
points:
  dance-floor: {label: Dance floor, at: [2.5, 5.0, 0.0]}
  screen: {label: Karaoke screen, at: [5.0, 5.0, 2.0]}   # projected on the east wall between the bars,
                                    # ~2 m wide (owner, 26 Nov); 16:9, centre 2 m up assumed
  singer: {label: Singer's spot, at: [3.8, 5.0, 1.2]}   # provisional: 1.2 m in front of the picture, chest height
                                    # (the lights' "stage-waits" and "next-up" scenes aim here)
  west-wall: {label: West wall above heads, at: [0.0, 5.0, 3.0]}   # the heads' rest: upright with a 180° tilt they
                                    # reach only down to horizontal (2.68 m), never the floor
regions:
  dance-floor: {label: Dance floor, surface: floor, centre: [2.5, 5.0, 0.0], size: [3.0, 5.0]}
surfaces: {}
