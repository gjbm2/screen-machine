# deployments/laptop/lights/space.yaml: the laptop rig's room, in metres (docs/LIGHTS.md §3: x east, y north, z up; the
# origin is the south-west floor corner). Hand-written; the Lights page's room editor writes space.added.yaml beside it
# (merged under this file: this file wins, and what is set here shows as locked there).
#
# PROVISIONAL (owner, 26 Nov: "a sensible neutral configuration for now ... NE and SE, 10M apart ... ceiling height is
# 4M"): a room 5 m east-west by 10 m north-south with a 4 m ceiling; the two GigBARs on their tripods in the east
# corners, bar A NE and bar B SE (A on the left as the room faces them), their bars at 2.5 m, 0.4 m in from each wall,
# each turned to face the room's centre (bars, in space.added.yaml: move them on the Lights page's 3D tab). The
# moving heads stand upright on the bar, facing its front, until "Point it at…" teaches each its real pose from three
# places (docs/LIGHTS.md §3.6). Measure the real room and bars on the day.
version: 1
room:
  size: [5.0, 10.0, 4.0]
  front: east                       # the wall people face: the bars' wall
  haze_half_life_s: 150             # provisional: haze the room, stop the hazer, and time how long it takes to halve
                                    # (show_service/atmosphere.py holds the haze from this and the room's size)

# The two GigBARs are bars (below "appliances"): each is one thing with a place, a height and a facing, set on the
# Lights page's 3D tab (space.added.yaml), and its parts sit where the layout says along it. So there is no line per
# part here any more: a part given its own `at` under appliances keeps that place instead.
# The hazer, the house lights, the screen, the named places and the dance floor area are set on the Lights page (Light
# setup › Room: the room editor), in space.added.yaml (owner, 27 Nov: everything in the room editable there). Their
# provisional places: the hazer on the floor by bar B; the ceiling downlights a 2 x 2 grid 3.95 m up; the projected
# picture ~2 m wide (16:9, centre 2 m up assumed) on the east wall between the bars; the singer's spot 1.2 m in front
# of it at chest height (the "stage-waits" and "next-up" scenes aim there); the west wall above heads at 3 m (the
# heads' rest: upright with a 180-degree tilt they reach only down to level, never the floor).
appliances: {}
# What a GigBAR MOVE + ILS is, along its bar, measured off the maker's datasheet picture (Chauvet DJ "GigBAR Move +
# ILS" datasheet: the unit 1100 x 144 x 449 mm, the bar 14 kg; 690 px of bar = 1100 mm, so about 1.6 mm a pixel;
# docs/GIGBAR_RIG.md §1.1). Left to right as you face it: spot 1 hanging under the bar's left end, derby 1 on top, par
# 1 hanging under, the laser on top in the middle (the four strobes, strobe1-4, are lenses in the bar's face at -0.49,
# -0.16, 0.16 and 0.49 m), par 2 under, derby 2 on top, spot 2 under the right end. along: metres from the bar's middle (+ to
# the right as you face it); up: metres from the bar's centre line to the part's pivot (- below); head: a moving head;
# hang: it hangs upside down; turns: false: a U-bracket, so it only tilts, about the bar's length, and faces where the
# bar faces. type: the part's light type (a planned bar is drawn from it). lean_deg: how it points as it ships until set on the Lights page (degrees forward from straight up; 90 is
# level): the datasheet picture has the pars and derbies level. The laser's tilt is the 45-degree rule until set.
layouts:
  gigbar-move:
    parts:
      spot1:  {along: -0.46, up: -0.13, head: true, hang: true, type: gigbar-spot}
      derby1: {along: -0.35, up: 0.13,  turns: false, lean_deg: 90, type: gigbar-derby}
      par1:   {along: -0.16, up: -0.15, turns: false, lean_deg: 90, type: gigbar-par}
      strobe1: {along: -0.49, type: gigbar-strobe-led}              # the four strobe lenses, in the bar's face: they point where it does
      strobe2: {along: -0.16, type: gigbar-strobe-led}
      strobe3: {along: 0.16, type: gigbar-strobe-led}
      strobe4: {along: 0.49, type: gigbar-strobe-led-s}
      laser:  {along: 0.0,   up: 0.12,  turns: false, type: gigbar-laser}
      par2:   {along: 0.16,  up: -0.15, turns: false, lean_deg: 90, type: gigbar-par}
      derby2: {along: 0.35,  up: 0.13,  turns: false, lean_deg: 90, type: gigbar-derby}
      spot2:  {along: 0.46,  up: -0.13, head: true, hang: true, type: gigbar-spot}
points: {}
regions: {}
surfaces: {}
