# Where this deployment has AI pictures made that it can't make itself (the karaoke singers' riffs:
# routes/karaoke/singer_riffs.py): PC22's generation API (docs/API.md). Its key is this machine's secret,
# ~/.config/screen-machine/generation_api.key (made on PC22: Settings > Apps & API keys, scope generate).
base: https://screen.finsburybankforsavings.com/api/v1
workflow: qwen21-edit   # "Adapt an image" (GET {base}/workflows): the photo changed by the prompt
params: {shape: photo, skip-upscaling: true}   # the photo's own shape (extending it to 16:9 kept the photo as it was)
refiner: none       # the riff prompts are sent as written (a refiner could lose "keep their likeness")
