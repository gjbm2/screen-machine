# deployments/laptop/show.yaml: the laptop rig's layer over config/room/show.yaml (deployments/README.md).
# The room's ears: the laptop's own microphone (the Windows default input), sent by the audio agent running on this
# laptop's Windows side (tools/show_sender/pc22_agent.py; deployments/README.md "Room audio on a WSL machine").
# "windows" is the Windows machine this WSL runs on (show_service resolves it each time; no fixed address).
senders:
  laptop:
    hosts: [windows]
    port: 6984
    streams: [room-mic]                     # this rig's room mic: Auto listens to room-mic first
    label: Laptop                           # the Room page's Mic list groups this sender's inputs under it

# The GigBARs' parts as their own surfaces (owner, 26 Nov: scenes, effects and transitions "across each of the gigbar
# components"). The shared file has movers (the spots) and lamps (every other light); here the derbies and the strobe
# zones leave lamps for groups of their own, so each part draws its own scene: the pars wash, the derbies their own
# pattern, and the strobe zones only the scenes written for them (tags.parts: [flash]: dark but for accents).
lights:
  groups:
    lamps: {label: Pars, select: "kind:lamp !tag:derby !tag:strobe !tag:laser !tag:haze !tag:house", carries_beat: 2}
    lasers: {label: Lasers, select: "tag:laser", dark_level: 0, scenes_for: [laser], repeat_weight: 1.0}
    derbies: {label: Derbies, select: "tag:derby", dark_level: floor, scenes_for: [derby], carries_beat: 3}
    flashes: {label: Strobe zones, select: "tag:strobe", dark_level: 0, scenes_for: [flash],
              repeat_weight: 1.0}             # they may keep their scene across a change (resting stays resting)
  # Line-ups: which parts of the bars play (owner, 27 Nov; docs/GIGBAR_RIG.md §1.4: the unit's own shows are line-ups
  # of its parts, and footage of it lights two or three against a dark room). At each change of scene the art
  # director draws one: the groups it names play, the others rest (their scenes tagged rest: dark, or a low glow).
  #   into   the kind of section it is for (a karaoke song's lyrics name them): verse | chorus | final_chorus |
  #          climax (the song's measured climax, when that isn't its last chorus) | instrumental | outro | any
  #   drive  the band of the music's drive it is for (0..1: its groove, and the song's measured level over the
  #          section coming when a karaoke song gives one, else the energy being directed)
  # A verse is two parts, a chorus three or four, the last chorus everything, a break the laser and the heads.
  # Starting points, chosen by reasoning, never seen on the lights.
  lineups:
    spots-alone:        {label: The two pairs of heads alone, plays: [movers], into: [verse, outro, any], drive: [0.0, 0.45]}
    pars-alone:         {label: The pars alone, plays: [lamps], into: [verse, outro, any], drive: [0.0, 0.4]}
    pars-and-spots:     {label: Pars and heads, plays: [lamps, movers], into: [verse, any], drive: [0.2, 0.75], weight: 1.5}
    pars-and-derbies:   {label: Pars and derbies, plays: [lamps, derbies], into: [verse, any], drive: [0.3, 0.8]}
    derbies-and-spots:  {label: Derbies and heads, plays: [derbies, movers], into: [verse, chorus, any], drive: [0.4, 0.9]}
    spots-and-laser:    {label: Heads and the laser, plays: [movers, lasers], into: [instrumental, any], drive: [0.2, 0.8],
                         weight: 0.7}
    derbies-and-laser:  {label: Derbies and the laser, plays: [derbies, lasers], into: [instrumental], drive: [0.3, 0.9]}
    pars-spots-derbies: {label: "Pars, heads and derbies", plays: [lamps, movers, derbies], into: [chorus, any],
                         drive: [0.5, 1.0], weight: 1.5}
    pars-derbies-flash: {label: Pars and derbies with the strobes, plays: [lamps, derbies, flashes], into: [chorus, any],
                         drive: [0.6, 1.0]}
    pars-spots-flash:   {label: Pars and heads with the strobes, plays: [lamps, movers, flashes], into: [chorus, any],
                         drive: [0.6, 1.0]}
    spots-derbies-laser: {label: Heads and derbies with the laser, plays: [movers, derbies, lasers], into: [chorus],
                          drive: [0.55, 1.0], weight: 0.7}
    everything:         {label: Everything, plays: [lamps, movers, derbies, flashes, lasers], into: [final_chorus, climax],
                         drive: [0.0, 1.0], weight: 3.0}
    everything-but-laser: {label: Everything but the laser, plays: [lamps, movers, derbies, flashes], into: [chorus, any],
                           drive: [0.8, 1.0], weight: 0.6}
