# deployments/finsbury/lights/space.yaml: the room in metres (docs/LIGHTS.md §3). x east, y north, z up; origin the south-west floor
# corner. Hand-written; the Lights page's Room map writes deployments/finsbury/lights/space.added.yaml (merged under this file: this
# file wins on a clash). show_service re-reads both when they change. Nothing here is measured yet: set the room on the
# Room map (or here), never guess. Anything set here can't be moved on the page (it shows as fixed), so leave a thing
# commented while it is placed on the map.
#
# The drawing room as known: the two Frame TVs hang side by side on the SAME wall, the west wall, both FACING EAST
# (owner, 22 Oct: "they're not on opposite walls ... they are on the same side, facing east"): the south screen at the
# south end, on the left as you face them, and the north screen at the north end, on the right. The four Hue lamps
# (owner, 14 Oct; deployments/finsbury/lights/patch.yaml and fixtures.yaml): "SE is above the south screen and SW opposite it; NE is
# above the north screen and NW opposite it"; the Steinway and the
# glitterball (room device mirror_ball: its motor turns with the flow, docs/LIGHTS.md §4.4) are in the room. Every
# measurement below is a commented starting point in <angle brackets>: measure it, or place it on the Room map.
# Ids are fixtures.yaml's (screen.north, hue.ne, ...) and the Lights page's lights (dmx.*).
version: 1
room:
  # size: [<east-west m>, <north-south m>, <floor to ceiling m>]   # measure
  front: west                      # the wall people face: the screens' wall (owner, 22 Oct), so the south screen is on
                                   # the left and the north screen on the right
appliances: {}                     # fixture id or room device -> where it is (the page writes these; the room's own:)
  # Both screens: on the west wall (x = 0), facing east (normal [1, 0, 0]); north screen at the larger y.
  # screen.north: {at: [0, <y: the picture's centre along the wall>, <z: centre height>],
  #               plane: {normal: [1, 0, 0], up: [0, 0, 1], size: [<picture width m>, <height m>]}}
  # screen.south: {at: [0, <y: south of the north screen>, <z>], plane: {normal: [1, 0, 0], up: [0, 0, 1],
  #               size: [<width m>, <height m>]}}
  # hue.ne: {at: [<x>, <y>, <z>]}                  # by the NE corner, above the north screen
  # hue.nw: {at: [<x>, <y>, <z>]}                  # by the NW corner, opposite the north screen
  # hue.se: {at: [<x>, <y>, <z>]}                  # by the SE corner, above the south screen
  # hue.sw: {at: [<x>, <y>, <z>]}                  # by the SW corner, opposite the south screen
  # dmx.mover-1: {at: [<x>, <y>, <z>], mount: ceiling}            # ceiling | floor | wall | truss (the solve's hint)
# The two GigBARs are bars (space.added.yaml bars, set on Light setup's Room editor): each is one thing with a place,
# a height and a facing, and its parts sit where this layout says along it (a part with its own `at` under
# appliances keeps that place instead). The layout is the laptop's (deployments/laptop/lights/space.yaml, 27 Nov).
# What a GigBAR MOVE + ILS is, along its bar, measured off the maker's datasheet picture (Chauvet DJ "GigBAR Move +
# ILS" datasheet: the unit 1100 x 144 x 449 mm, the bar 14 kg; 690 px of bar = 1100 mm, so about 1.6 mm a pixel;
# docs/GIGBAR_RIG.md §1.1). Left to right as you face it: spot 1 hanging under the bar's left end, derby 1 on top, par
# 1 hanging under, the laser on top in the middle (the four strobes, strobe1-4, are lenses in the bar's face at -0.49,
# -0.16, 0.16 and 0.49 m), par 2 under, derby 2 on top, spot 2 under the right end. along: metres from the bar's middle (+ to
# the right as you face it); up: metres from the bar's centre line to the part's pivot (- below); head: a moving head;
# hang: it hangs upside down; turns: false: a U-bracket, so it only tilts, about the bar's length, and faces where the
# bar faces. type: the part's light type (a planned bar is drawn from it); offset: its DMX channel offset from the
# bar's start address in the 52CH mode (fixtures.yaml's address plan). tags: the part's tags once the bar is connected
# (with the bar's own, space.added.yaml bars.<id>.tags: bar-a), which the groups and scenes select by. lean_deg: how it points as it ships until set on the Lights page (degrees forward from straight up; 90 is
# level): the datasheet picture has the pars and derbies level. The laser's tilt is the 45-degree rule until set.
layouts:
  gigbar-move:
    parts:
      spot1:  {along: -0.46, up: -0.13, head: true, hang: true, type: gigbar-spot, offset: 34, tags: [gigbar, spot, spot-1]}
      derby1: {along: -0.35, up: 0.13,  turns: false, lean_deg: 90, type: gigbar-derby, offset: 14, tags: [gigbar, derby]}
      par1:   {along: -0.16, up: -0.15, turns: false, lean_deg: 90, type: gigbar-par, offset: 0, tags: [gigbar, par]}
      strobe1: {along: -0.49, type: gigbar-strobe-led, offset: 26, tags: [gigbar, strobe, strobe-1]}              # the four strobe lenses, in the bar's face: they point where it does
      strobe2: {along: -0.16, type: gigbar-strobe-led, offset: 27, tags: [gigbar, strobe, strobe-2]}
      strobe3: {along: 0.16, type: gigbar-strobe-led, offset: 28, tags: [gigbar, strobe, strobe-3]}
      strobe4: {along: 0.49, type: gigbar-strobe-led-s, offset: 29, tags: [gigbar, strobe, strobe-4]}
      laser:  {along: 0.0,   up: 0.12,  turns: false, type: gigbar-laser, offset: 31, tags: [gigbar, laser]}
      par2:   {along: 0.16,  up: -0.15, turns: false, lean_deg: 90, type: gigbar-par, offset: 7, tags: [gigbar, par]}
      derby2: {along: 0.35,  up: 0.13,  turns: false, lean_deg: 90, type: gigbar-derby, offset: 20, tags: [gigbar, derby]}
      spot2:  {along: 0.46,  up: -0.13, head: true, hang: true, type: gigbar-spot, offset: 43, tags: [gigbar, spot, spot-2]}
points: {}                         # named places lights can aim at (the page writes these too; the room's own:)
  # piano: {label: The piano, at: [<x>, <y>, <z: the lid>]}
  # mirror-ball: {label: Mirror ball, at: [<x>, <y>, <z>], device: mirror_ball}
regions: {}                        # named areas on a surface, e.g. a dance floor (centre + size on that surface)
  # dance-floor: {label: Dance floor, surface: floor, centre: [<x>, <y>, 0], size: [<w>, <d>]}
surfaces: {}                       # extra planes beyond floor, ceiling and the four walls
  # tv-wall: {label: TV wall, origin: [...], normal: [...], up: [...], size: [<w>, <h>]}
