# deployments/finsbury/show.yaml: this site's layer of show_service's settings. show_service deep-merges it over the
# shared config/room/show.yaml (smconfig.load_layered_yaml: mappings merge key by key, anything else replaces), and
# re-reads both when either changes. Only facts about this room live here: its audio senders and their addresses, its
# MIDI stream, its Sonos zone, its light sensor, its glitterball's and pinspots' room targets (the remote-worked
# appliances) and which side each screen is on.
# Tuning stays in the shared file. Moved here verbatim from config/room/show.yaml on 10 Nov 2026.

senders:
  # LIVE 18 Oct (owner: "plug the MIDI cable / a mic into the mini-PC and it Just Works"): the kiosk's show-sender
  # (a systemd --user unit, tools/show_sender/deploy.sh) sends the Steinway's USB MIDI and a USB mic whenever they are
  # plugged in; with neither, its heartbeats say no_device. The mic still captures only on demand (mic.py).
  kiosk:                                    # screen-machine-drawingroom, 98's show_sender.py
    hosts: ["192.168.1.10", "192.168.1.92"] # Ethernet over powerline (primary since 13 Oct), then Wi-Fi (docs/PORTS.md)
    port: 6980
    streams: [room-mic, room-piano]
    label: Drawing room                     # the Room page's Mic list groups this sender's inputs under it
  pc22:                                     # a PC22 mic (the Dell monitor's: the Insta360 lags 134-148 ms) until the
    hosts: ["192.168.1.205"]                # kiosk's arrives: tools/show_sender/pc22_agent.py on Windows, run by
    port: 6984                              # Spectre's audio-agent card (d4, 16 Oct; SHOW_ENGINE §3.2 "PC22")
    streams: [pc22-mic]
    label: PC22                             # the Room page's Mic list groups this sender's inputs under it

situations:
  midi:
    streams: [room-piano]                   # the MIDI streams that count. test-piano, phone-test and pc22-* never do
                                            # unless they are listed here or a rule sets include_test: true.
  sonos:
    now_playing: sonos.drawing-room.now_playing     # room targets (sonos.json zone "drawing-room")
    volume: sonos.drawing-room.volume
  light:
    sensor: living-room                     # the sensor a rule reads when it names none (the route's only one today)

lights:
  # The GigBARs' parts as their own surfaces (owner, 26 Nov: scenes, effects and transitions "across each of the gigbar
  # components"; the laptop's groups, deployments/laptop/show.yaml). The shared file has movers (the spots) and lamps
  # (every other light); here the derbies, the strobe LEDs and the lasers leave lamps for groups of their own, so each
  # part draws its own scene. lamps keeps the bars' pars AND the four Hue lamps (owner, 28 Nov: "the four in the room
  # are designed to be part of the washes").
  groups:
    lamps: {label: Washes (pars and Hue), select: "kind:lamp !tag:derby !tag:strobe !tag:laser !tag:haze !tag:house",
            carries_beat: 2}
    # reads_under_lux, lands_on (config/room/show.yaml lights.room_light; docs/LIGHTS.md §7.5): the room light a
    # low-power part needs to be seen, and where it lands. The laptop's figures (worked out in its 3D room for a
    # 5 x 10 x 4 m pale room); this room is about the same size. Check by eye with the real bars.
    lasers: {label: Lasers, select: "tag:laser", dark_level: 0, scenes_for: [laser], repeat_weight: 1.0,
             reads_under_lux: 3, lands_on: [ceiling]}
    derbies: {label: Derbies, select: "tag:derby", dark_level: floor, scenes_for: [derby], carries_beat: 3,
              reads_under_lux: 20}
    flashes: {label: Strobe LEDs, select: "tag:strobe", dark_level: 0, scenes_for: [flash],
              repeat_weight: 1.0}             # they may keep their scene across a change (resting stays resting)
    remote-lights:                          # owner, 28 Oct: the glitterball and the pinspots are appliances the art
      label: Glitterball and pinspots       # director programs like any light group, with their own scenes (the
      appliances: [glitterball, pinspots]   # light scenes with an appliances block; a mode's light scene tags narrow
      repeat_weight: 0.5                    # them). repeat_weight: they may stay resting (or lit) twice running
  # The room's remote-worked appliances (show_service/appliances.py): which room target works each capability. The
  # director sends a change only while the mode lets it use the appliance (room's director.<id> row), never while the
  # room is changing mode, at most once per min_gap_s per target (default 2 s). YAML: on/off must be quoted.
  appliances:
    glitterball:
      label: Glitterball
      controls:
        pan_spin:                           # the motor: off when the spin is 0, its size the speed, its sense the way
          power: {target: mirror_ball.main, "on": spinning, "off": stopped}
          speed: {target: mirror_ball_motor.speed, words: [[0.0, low], [0.4, medium], [0.75, high]]}
          direction: {target: mirror_ball_motor.direction, cw: clockwise, ccw: anticlockwise, min_gap_s: 120}
    pinspots:
      label: Pinspots
      controls:
        intensity:
          power: {target: pinspots.main, "on": "on", "off": "off"}
          level: {target: pinspots.level, steps: 8}
        colour_slot: {target: pinspots.colour}   # the scene's slot word is the remote's colour (white, red, fade, ...)
        shutter: {target: pinspots.flash, strobe: "on", open: "off"}
  # The light the room has whatever the lights do (config/room/show.yaml lights.room_light; docs/LIGHTS.md §7.5): here
  # the two 65" Frames playing live, never dimmed. An ESTIMATE, not measured: each is ~1.16 m2; live scenes average
  # perhaps 80 cd/m2, so pi x 80 x 1.16 = ~290 lm each, ~580 lm for both; at the laptop room's 115 lm a lux (a room
  # this size, pale surfaces) about 5 lux. MEASURE IT: blinds shut, the DMX lights and Hue off, both screens live
  # through a song, the living-room sensor's lux (room_service /api/v1/status) is the figure.
  room_light:
    other_lux: 5.0
  # The hazer is planned (fixtures.yaml): connected from the Light setup it has no tags, so it is found by its type too.
  atmosphere:
    select: "tag:haze | type:z-350"
  flow:
    mirror_ball:
      enabled: false                        # owner, 28 Oct: the glitterball is an appliance in lights.groups now (its
                                            # scenes' spin follows the flow); true: the old flow-only motor control
      power_member: mirror_ball.main
      direction_target: mirror_ball_motor.direction
      speed_target: mirror_ball_motor.speed

  lineups:
    spots-alone:        {label: The two pairs of heads alone, plays: [movers], into: [verse, outro, any], drive: [0.0, 0.45]}
    pars-alone:         {label: The pars alone, plays: [lamps], into: [verse, outro, any], drive: [0.0, 0.4]}
    pars-and-spots:     {label: Pars and heads, plays: [lamps, movers], into: [verse, any], drive: [0.2, 0.75], weight: 1.5}
    pars-and-derbies:   {label: Pars and derbies, plays: [lamps, derbies], into: [verse, any], drive: [0.3, 0.8],
                         features: [derbies]}
    derbies-and-spots:  {label: Derbies and heads, plays: [derbies, movers], into: [verse, chorus, any], drive: [0.4, 0.9],
                         features: [derbies]}
    spots-and-laser:    {label: Heads and the laser, plays: [movers, lasers], into: [instrumental, any], drive: [0.2, 0.8],
                         weight: 0.7, features: [lasers]}
    derbies-and-laser:  {label: Derbies and the laser, plays: [derbies, lasers], into: [instrumental], drive: [0.3, 0.9],
                         features: [lasers, derbies]}
    pars-spots-derbies: {label: "Pars, heads and derbies", plays: [lamps, movers, derbies], into: [chorus, any],
                         drive: [0.5, 1.0], weight: 1.5}
    pars-derbies-flash: {label: Pars and derbies with the strobes, plays: [lamps, derbies, flashes], into: [chorus, any],
                         drive: [0.6, 1.0]}
    pars-spots-flash:   {label: Pars and heads with the strobes, plays: [lamps, movers, flashes], into: [chorus, any],
                         drive: [0.6, 1.0]}
    spots-derbies-laser: {label: Heads and derbies with the laser, plays: [movers, derbies, lasers], into: [chorus],
                          drive: [0.55, 1.0], weight: 0.7, features: [derbies]}
    everything:         {label: Everything, plays: [lamps, movers, derbies, flashes, lasers], into: [final_chorus, climax],
                         drive: [0.0, 1.0], weight: 3.0}
    everything-but-laser: {label: Everything but the laser, plays: [lamps, movers, derbies, flashes], into: [chorus, any],
                           drive: [0.8, 1.0], weight: 0.6}

ensemble:
  players:
    zones: {south: left, north: right}      # owner, 22 Oct: "south (left) ... north (right)". The Room map's positions
                                            # win once the room is placed and its front set (facing west, south left).
