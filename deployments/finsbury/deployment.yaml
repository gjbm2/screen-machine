# deployments/finsbury/deployment.yaml: the production deployment on PC22 (the drawing room). See deployments/README.md.
# Everything here was code defaults or scattered constants before 10 Nov 2026; the values reproduce that behaviour.
id: finsbury
name: Drawing room (PC22)
description: Production. Two Samsung Frames (north, south) on the drawing-room kiosk, Hue + DMX + RF, Sonos, e-ink tags.

# The default for a screen's light curve when its intensity_cfg names no lat/lon (was config.py's London default).
location: {lat: 51.5074, lon: -0.1278}

# The room a caller means when it names none (Alexa's fallback, the Room page's first room).
default_room: drawing-room

# Flask's art director: the room modes it makes art in, and the rooms it looks after (default: every room with
# screens). Was hard-coded to ambient and the drawing room.
art_director: {modes: [ambient], rooms: [drawing-room]}

# Site phrases in prompts and page copy (smconfig Deployment.words(key, generic default)). These keep PC22's text
# exactly as it was; a deployment without them gets the generic wording. deployments/README.md lists the keys.
wording:
  art_screen: a 4K TV                       # image generator: "made for <art_screen> in <art_space>"
  art_space: a living room
  art_library: living-room art library      # art tagger
  art_screens: two 4K TVs
  listen_space: a home's drawing room       # show_service's listener prompt
  screen_device: TV                         # room_service: "TV pages", "Show details on the TV"
  lights_menu: Lamps, glitterball, pinspots # the app menu's Lights hint
  windows_host: PC22                        # show_service: the Windows host's name in piano/Sonos copy
  windows_speakers: PC22 speakers
  artnet_no_replies: "no replies yet: nodes answer on PC22's udp 6454, which ca's relay forwards to room_service (README S5.7)"
  ad_room: a drawing room                   # treatment prompt: "the art director of <ad_room>: <ad_rig>"
  ad_rig: two large TVs showing generative scenes, lamps, and on some modes a glitterball and pinspots
  site_address: screen.finsburybankforsavings.com   # the Alexa overlays, under the QR (left out when unset)
  feel_room: drawing room                   # config/room/vibes.yaml personas: "A lived-in {feel_room} ..."

capabilities:
  generation: true
  art_director: true
  art_tags: true
  alexa: true
  tv_power: true
  kiosk_admin: true
  alerts: true
  ngrok: true
  room: true
  live: true
  show: true
  dot: true
  dmx: true
  hue: true
  rf: true
  blinds: true
  sonos: true
  accounts: true
  karaoke: true      # docs/KARAOKE.md (owner, 27 Nov: the Karaoke mode on PC22 too)

# Ports on this machine (these are the defaults; docs/PORTS.md is the register, Spectre mirrors it).
ports: {flask: 5000, overlay_ws: 8765, room: 8700, show_bus: 8701, stream: 8702, show: 8703, dot: 8704}

# The kiosk mini-PC that drives the TVs (media-server/remote-scripts). SSH secrets stay in
# media-server/local-scripts/.env (MEDIA_SERVER_*), which overrides host and user here.
kiosk:
  host: 192.168.1.92            # Wi-Fi address the admin scripts use (powerline is 192.168.1.10)
  user: gjbm2
  base_url: http://95.141.21.170:8000   # what the kiosk Chrome loads /display/<screen> from (WAN 8000 -> PC22 8080)
  screens:
    north-screen: {name: north, output: HDMI-A-1, cdp_port: 9222}
    south-screen: {name: south, output: HDMI-A-2, cdp_port: 9223}

# Machine paths the services use (WSL on PC22).
host:
  fonts_dir: /mnt/c/Windows/Fonts
  windows_python: /mnt/c/Windows/py.exe
  karaoke_python: ~/.venvs/sm-karaoke/bin/python   # torch (cu128) + audio-separator + yt-dlp: docs/KARAOKE.md
  karaoke_js_runtime: node:/home/gjbm2/.nvm/versions/node/v22.21.0/bin/node   # yt-dlp's YouTube JS runtime
  piano_audition_dir: "/mnt/c/Users/Greg/Music/Piano audition"
